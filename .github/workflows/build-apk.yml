==================================================
EXPERIENCE V2 MUST REMAIN
==================================================

Preserve the similarity-based Experience V2 system included in R2.

Experience should retrieve SIMILAR historical setups rather than requiring exact setup equality.

Experience must remain an advisory layer.

It must NOT become the primary direction engine.

Experience must NEVER directly change:

UP → DOWN

or

DOWN → UP.

If historical experience strongly indicates that the proposed entry conditions repeatedly performed poorly, it may reduce setup quality or produce WAIT.

Experience must learn setup conditions, not directional prejudice.

Small historical sample sizes must have small influence.

Influence may increase gradually as reliable similar completed-trade evidence accumulates.

