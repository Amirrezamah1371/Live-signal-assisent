name: Extract Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "*.zip"
      - ".github/workflows/build-apk.yml"

jobs:
  extract-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Find target ZIP
        shell: bash
        run: |
          ZIP_FILE="$(find . -maxdepth 1 -type f -iname "LiveSignalAssistant-APK-*.zip" -print0 | xargs -0 -r ls -1t | head -n 1)"

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: ZIP file not found"
            exit 1
          fi

          echo "ZIP_FILE=$ZIP_FILE" >> "$GITHUB_ENV"
          echo "Selected ZIP: $ZIP_FILE"

      - name: Extract APK
        shell: bash
        run: |
          rm -rf extracted
          mkdir -p extracted

          unzip -q "$ZIP_FILE" -d extracted

          APK_FILE="$(find extracted -type f -name "*.apk" | head -n 1)"

          if [ -z "$APK_FILE" ]; then
            echo "ERROR: APK not found inside ZIP"
            exit 1
          fi

          echo "APK_FILE=$APK_FILE" >> "$GITHUB_ENV"
          echo "APK found: $APK_FILE"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: LiveSignalAssistant-APK
          path: ${{ env.APK_FILE }}
          if-no-files-found: error
