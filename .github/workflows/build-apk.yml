==================================================
19. PERFORMANCE
==================================================

The analysis loop must remain lightweight.

Do not freeze the UI.

Do not create unnecessary bitmap allocations every cycle.

Reuse buffers where possible.

Perform expensive processing away from the main UI thread.

Prevent memory leaks.

Prevent multiple analysis loops from accidentally running simultaneously.

==================================================
20. SAFETY AGAINST DUPLICATE SIGNALS
==================================================

Do not repeatedly publish the identical signal every analysis cycle.

Maintain a candidate state.

Only publish when:

a new valid setup appears

or

the previous setup materially changes.

If the user does not enter and the setup remains valid, keep displaying it without creating multiple fake trade records.

