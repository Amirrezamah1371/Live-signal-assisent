name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "LiveSignalAssistant_latest_fixed.zip"
      - ".github/workflows/build-apk.yml"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify project ZIP
        run: |
          test -f LiveSignalAssistant_latest_fixed.zip
          echo "ZIP found successfully"

      - name: Extract project
        run: |
          rm -rf extracted
          mkdir extracted
          unzip -q LiveSignalAssistant_latest_fixed.zip -d extracted
          echo "ZIP extracted successfully"
          find extracted -maxdepth 4 -type f | sort

      - name: Find Android project
        id: project
        shell: bash
        run: |
          SETTINGS=$(find extracted -type f \( -name "settings.gradle" -o -name "settings.gradle.kts" \) | head -n 1)

          if [ -z "$SETTINGS" ]; then
            echo "ERROR: settings.gradle/settings.gradle.kts not found"
            find extracted -maxdepth 5 -type f | sort
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS")

          echo "Android project found at: $PROJECT_DIR"
          echo "dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"

          if [ ! -d "$PROJECT_DIR/app" ]; then
            echo "ERROR: app directory not found"
            exit 1
          fi

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Force JVM 17 compatibility
        shell: bash
        run: |
          PROJECT_DIR="${{ steps.project.outputs.dir }}"

          BUILD_FILE="$PROJECT_DIR/app/build.gradle"

          if [ -f "$BUILD_FILE" ]; then
            cat >> "$BUILD_FILE" <<'EOF'

          android {
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }

          tasks.withType(org.jetbrains.kotlin.gradle.tasks.KotlinCompile).configureEach {
              kotlinOptions {
                  jvmTarget = "17"
              }
          }
          EOF
          else
            echo "app/build.gradle not found; skipping Groovy JVM patch."
          fi

      - name: Build APK
        shell: bash
        run: |
          PROJECT_DIR="${{ steps.project.outputs.dir }}"
          cd "$PROJECT_DIR"

          echo "Building project from: $(pwd)"

          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
            ./gradlew --no-daemon clean assembleDebug
          else
            gradle --no-daemon clean assembleDebug
          fi

      - name: Locate APK
        id: apk
        shell: bash
        run: |
          PROJECT_DIR="${{ steps.project.outputs.dir }}"

          APK=$(find "$PROJECT_DIR" -type f -name "*.apk" | head -n 1)

          if [ -z "$APK" ]; then
            echo "ERROR: APK not found"
            exit 1
          fi

          echo "APK generated: $APK"
          echo "path=$APK" >> "$GITHUB_OUTPUT"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: LiveSignalAssistant-APK
          path: ${{ steps.apk.outputs.path }}
          if-no-files-found: error
