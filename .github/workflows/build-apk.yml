==================================================
16. FIX THE UP-ONLY / DOWN-ONLY BUG
==================================================

Audit the complete signal engine specifically for the bug where the application sometimes generates only UP or only DOWN.

Search for:

- stale previousDirection state
- shared state between bullish and bearish engines
- incorrect positive/negative signs
- inverted screen Y-axis calculations
- asymmetric thresholds
- asymmetric normalization
- else-if branches preventing both directions from being evaluated
- cached direction
- incorrect comparison operators
- bullish logic accidentally reused for bearish logic
- bearish logic accidentally reused for bullish logic

IMPORTANT:

On Android screen coordinates, Y normally increases downward.

Make absolutely sure screen-coordinate movement is correctly converted into chart price direction.

An upward visual price movement must not accidentally be interpreted as bearish because of screen Y coordinates.

