name: Build 5M MULTI-SCALE 5.9.0

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # ============================================================
      # SOURCE:
      # This build MUST use the new 5M MULTI-SCALE 5.9.0 source.
      #
      # DESIGN GOAL:
      # - 5-minute signals ONLY.
      # - 1-minute signals must NOT be generated.
      # - Keep this as a separate Android application so it can be
      #   installed beside the previous TIMEFRAME BRAIN version.
      #
      # 5M LOGIC:
      # The analyzer must not judge direction only from the latest
      # tiny price movement.
      #
      # It should compare the current position with several visible
      # historical scales of the chart:
      #
      #   1. Broad visible range / zoomed-out context
      #   2. Older structural movement
      #   3. Recent swing structure
      #   4. Current short movement
      #
      # IMPORTANT:
      # Being near a LOW is not enough by itself to force UP.
      # The analyzer should look for evidence that price is actually
      # turning/recovering upward from the lower region.
      #
      # LOW REGION + CONFIRMED UPWARD RECOVERY:
      #   Suppress contradictory DOWN candidates and strengthen UP.
      #
      # HIGH REGION + CONFIRMED DOWNWARD REVERSAL:
      #   Suppress contradictory UP candidates and strengthen DOWN.
      #
      # MID-RANGE:
      #   Preserve the underlying 5-minute analysis rather than
      #   blindly forcing either direction.
      #
      # The objective is structural context + direction + timing,
      # not a simplistic "low = UP / high = DOWN" rule.
      # ============================================================

      - name: Verify source ZIP
        shell: bash
        run: |
          set -e

          ZIP_FILE="$GITHUB_WORKSPACE/LiveSignalAssistant_5M_MULTISCALE_590.zip"

          echo "================================================"
          echo "Looking for 5M MULTI-SCALE 5.9.0 source"
          echo "================================================"
          echo "$ZIP_FILE"

          if [ ! -f "$ZIP_FILE" ]; then
            echo "ERROR: LiveSignalAssistant_5M_MULTISCALE_590.zip was not found."
            echo ""
            echo "Repository root:"
            ls -la "$GITHUB_WORKSPACE"
            exit 1
          fi

          echo "Source ZIP found."
          echo "Testing ZIP integrity..."

          unzip -t "$ZIP_FILE"

          echo "ZIP integrity OK."

      - name: Extract 5.9.0 project
        shell: bash
        run: |
          set -e

          ZIP_FILE="$GITHUB_WORKSPACE/LiveSignalAssistant_5M_MULTISCALE_590.zip"
          BUILD_DIR="$GITHUB_WORKSPACE/multiscale-590-build"

          rm -rf "$BUILD_DIR"
          mkdir -p "$BUILD_DIR"

          unzip -q "$ZIP_FILE" -d "$BUILD_DIR"

          echo "Project extracted."
          echo ""
          echo "Extracted structure:"
          find "$BUILD_DIR" -maxdepth 3 -type f | head -100

      - name: Locate Android project
        id: project
        shell: bash
        run: |
          set -e

          BUILD_DIR="$GITHUB_WORKSPACE/multiscale-590-build"

          SETTINGS_FILE=$(find "$BUILD_DIR" -type f -name "settings.gradle" | head -1)

          if [ -z "$SETTINGS_FILE" ]; then
            SETTINGS_FILE=$(find "$BUILD_DIR" -type f -name "settings.gradle.kts" | head -1)
          fi

          if [ -z "$SETTINGS_FILE" ]; then
            echo "ERROR: Android settings.gradle/settings.gradle.kts not found."
            find "$BUILD_DIR" -maxdepth 6 -type f | sort
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS_FILE")

          echo "Android project located at:"
          echo "$PROJECT_DIR"

          if [ ! -d "$PROJECT_DIR/app" ]; then
            echo "ERROR: Android app module not found."
            exit 1
          fi

          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"

      - name: Verify analyzer and application identity
        shell: bash
        run: |
          set -e

          PROJECT_DIR="${{ steps.project.outputs.project_dir }}"

          SIGNAL_ANALYZER=$(find "$PROJECT_DIR/app/src" -type f -name "SignalAnalyzer.kt" | head -1)
          CAPTURE_SERVICE=$(find "$PROJECT_DIR/app/src" -type f -name "CaptureService.kt" | head -1)

          if [ -z "$SIGNAL_ANALYZER" ]; then
            echo "ERROR: SignalAnalyzer.kt not found."
            exit 1
          fi

          if [ -z "$CAPTURE_SERVICE" ]; then
            echo "ERROR: CaptureService.kt not found."
            exit 1
          fi

          echo "SignalAnalyzer:"
          echo "$SIGNAL_ANALYZER"

          echo ""
          echo "CaptureService:"
          echo "$CAPTURE_SERVICE"

          echo ""
          echo "Checking MULTI-SCALE source markers..."

          if ! grep -q "multiScale" "$SIGNAL_ANALYZER"; then
            echo "ERROR: MULTI-SCALE analysis marker not found."
            exit 1
          fi

          echo "MULTI-SCALE analyzer detected."

          echo ""
          echo "Checking application ID..."

          BUILD_FILE="$PROJECT_DIR/app/build.gradle.kts"

          if [ ! -f "$BUILD_FILE" ]; then
            BUILD_FILE="$PROJECT_DIR/app/build.gradle"
          fi

          if [ ! -f "$BUILD_FILE" ]; then
            echo "ERROR: app Gradle build file not found."
            exit 1
          fi

          echo "Using:"
          echo "$BUILD_FILE"

          grep -n "applicationId" "$BUILD_FILE" || true
          grep -n "versionCode" "$BUILD_FILE" || true
          grep -n "versionName" "$BUILD_FILE" || true

          if ! grep -q "5.9.0" "$BUILD_FILE"; then
            echo "ERROR: Expected version 5.9.0 not found."
            exit 1
          fi

          echo ""
          echo "5.9.0 source identity verified."

      - name: Verify 5-minute-only design
        shell: bash
        run: |
          set -e

          PROJECT_DIR="${{ steps.project.outputs.project_dir }}"
          SIGNAL_ANALYZER=$(find "$PROJECT_DIR/app/src" -type f -name "SignalAnalyzer.kt" | head -1)

          echo "================================================"
          echo "5-MINUTE-ONLY VERIFICATION"
          echo "================================================"

          echo "Searching analyzer for active 60-second candidate generation..."

          if grep -nE 'evaluateCandidate[^;]*(60)|expiry[^;]*=[[:space:]]*60|intArrayOf[^;]*60|listOf[^;]*60' "$SIGNAL_ANALYZER"; then
            echo ""
            echo "ERROR: Possible active 1-minute candidate generation detected."
            echo "This version must generate 5-minute signals only."
            exit 1
          fi

          echo "No obvious active 1-minute candidate generation found."

          echo ""
          echo "Checking for 300-second / 5-minute horizon..."

          if ! grep -q "300" "$SIGNAL_ANALYZER"; then
            echo "ERROR: Expected 300-second 5-minute horizon was not found."
            exit 1
          fi

          echo "5-minute horizon detected."

      - name: Show Gradle information
        shell: bash
        run: |
          set -e

          PROJECT_DIR="${{ steps.project.outputs.project_dir }}"
          cd "$PROJECT_DIR"

          echo "================================================"
          echo "GRADLE ENVIRONMENT"
          echo "================================================"

          echo "Project:"
          pwd

          echo ""
          echo "Java:"
          java -version

          echo ""

          if [ -f "./gradlew" ]; then
            echo "Gradle wrapper detected."
            chmod +x ./gradlew
            ./gradlew --version
          else
            echo "Gradle wrapper not present."
            echo "Using GitHub installed Gradle."
            gradle --version
          fi

      - name: Clean previous outputs
        shell: bash
        run: |
          set -e

          PROJECT_DIR="${{ steps.project.outputs.project_dir }}"

          rm -rf "$PROJECT_DIR/app/build"
          rm -rf "$PROJECT_DIR/build"
          rm -rf "$GITHUB_WORKSPACE/apk-output"

          mkdir -p "$GITHUB_WORKSPACE/apk-output"

          echo "Old build outputs removed."

      - name: Build 5M MULTI-SCALE APK
        shell: bash
        run: |
          set -e

          PROJECT_DIR="${{ steps.project.outputs.project_dir }}"
          cd "$PROJECT_DIR"

          echo "================================================"
          echo "BUILDING 5M MULTI-SCALE 5.9.0"
          echo "================================================"

          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
            ./gradlew clean assembleDebug --stacktrace --no-daemon
          else
            gradle clean assembleDebug --stacktrace --no-daemon
          fi

      - name: Locate generated APK
        id: apk
        shell: bash
        run: |
          set -e

          PROJECT_DIR="${{ steps.project.outputs.project_dir }}"

          APK_FILE=$(find "$PROJECT_DIR/app/build/outputs/apk" -type f -name "*.apk" | head -1)

          if [ -z "$APK_FILE" ]; then
            echo "ERROR: Build finished but APK could not be located."
            find "$PROJECT_DIR" -type f -name "*.apk" || true
            exit 1
          fi

          OUTPUT_APK="$GITHUB_WORKSPACE/apk-output/LiveSignalAssistant-5M-MULTISCALE-5.9.0.apk"

          cp "$APK_FILE" "$OUTPUT_APK"

          echo "================================================"
          echo "APK CREATED SUCCESSFULLY"
          echo "================================================"

          ls -lh "$OUTPUT_APK"

          echo "apk_file=$OUTPUT_APK" >> "$GITHUB_OUTPUT"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: LiveSignalAssistant-5M-MULTISCALE-5.9.0
          path: apk-output/LiveSignalAssistant-5M-MULTISCALE-5.9.0.apk
          if-no-files-found: error
          retention-days: 30
