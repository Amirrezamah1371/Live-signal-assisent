EXPERIENCE MUST NEVER BECOME THE MAIN BRAIN




This rule is mandatory.


Experience modifies setup quality.


Experience does NOT determine market direction.


Experience MUST NOT directly convert:


UP -> DOWN


or:


DOWN -> UP


If current analysis proposes UP but similar historical UP entries performed badly:


Experience may weaken the setup or convert the final result to WAIT.


It must NOT produce DOWN merely because historical UP setups lost.


Same rule in reverse.




SMALL-SAMPLE SAFETY




Experience must begin recognizing similar historical samples without requiring a large exact-match sample.


However:


2 or 3 historical trades must NOT overpower current market analysis.


Experience influence must increase gradually based on:


sample count
similarity quality
historical consistency
WIN/LOSS distribution
recency


Small sample = small influence.


Repeated consistent evidence = stronger influence.


Never allow one WIN or one LOSS to rewrite the strategy.




EXPERIENCE MUST LEARN CONDITIONS, NOT DIRECTIONAL PREJUDICE




A LOSS must not teach:


"UP is bad"


or:


"DOWN is bad."


It must teach the conditions surrounding the bad entry.


For example:


late UP continuation
exhausted impulse
post-shock entry
weak reversal
counter-trend entry
