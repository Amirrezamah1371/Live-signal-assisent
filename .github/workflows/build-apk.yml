name: Build V5.5 MATURE APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "LiveSignalAssistant_V5_5_MATURE.zip"
      - ".github/workflows/build-apk.yml"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Extract V5.5 MATURE
        run: |
          rm -rf v55-build
          mkdir v55-build
          unzip -q LiveSignalAssistant_V5_5_MATURE.zip -d v55-build

      - name: Find Android project
        id: project
        shell: bash
        run: |
          SETTINGS=$(find "$GITHUB_WORKSPACE/v55-build" -type f -name "settings.gradle" -o -name "settings.gradle.kts" | head -n 1)

          if [ -z "$SETTINGS" ]; then
            echo "ERROR: Android project not found."
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS")
          echo "Project found at: $PROJECT_DIR"
          echo "dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build V5.5 MATURE APK
        working-directory: ${{ steps.project.outputs.dir }}
        shell: bash
        run: |
          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
            ./gradlew assembleDebug --stacktrace
          else
            echo "Gradle wrapper not found - using installed Gradle"
            gradle assembleDebug --stacktrace
          fi

      - name: Locate APK
        id: apk
        shell: bash
        run: |
          APK=$(find "${{ steps.project.outputs.dir }}" -type f -path "*/build/outputs/apk/debug/*.apk" | head -n 1)

          if [ -z "$APK" ]; then
            echo "ERROR: APK not found."
            exit 1
          fi

          echo "APK found: $APK"
          echo "path=$APK" >> "$GITHUB_OUTPUT"

      - name: Upload V5.5 MATURE APK
        uses: actions/upload
