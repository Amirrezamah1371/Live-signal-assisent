==================================================
ARCHITECTURE THAT MUST REMAIN
==================================================

ONE 90-second cycle:

0–80 seconds:
continuous deep observation and analysis.
NO trade signal may be published.

80–90 seconds:
Final Brain / Final Verification.

At the end of the cycle EXACTLY ONE result:

UP 2M
DOWN 2M
UP 3M
DOWN 3M
WAIT

WAIT must remain available.
Never force a trade merely to increase signal frequency.

==================================================
2M / 3M
==================================================

2M and 3M are independent prediction horizons.

2M predicts direction at Entry + 120 seconds.
3M predicts direction at Entry + 180 seconds.

Do NOT implement one shared prediction with two timers.

The Final Brain must choose:
- direction
- horizon
- or WAIT

based on the strongest reliable evidence.

After manual LOCK/START:

2M expiry = exactly 120 seconds from LOCK.
3M expiry = exactly 180 seconds from LOCK.

Use monotonic timing.

Expiry MUST NOT start from signal publication.

==================================================
V2 DUAL VISION — CRITICAL
==================================================

This V2 was created after forensic analysis showed the previous vision system behaved differently on AREA/LINE charts versus CANDLESTICK charts.

PRESERVE and audit the V2 dual-vision architecture.

The system must support:

1. CANDLE vision
2. AREA/LINE vision

It must detect which visual structure is present and use the appropriate extraction method.

CANDLE mode must NOT depend on an area-chart upper-edge algorithm.

AREA mode must NOT treat the entire colored fill as the price trajectory.

Vision must reject/downweight contamination from:

- horizontal current-price lines
- buttons/toolbars
- text
- trade overlays
- disconnected graphical elements
- filled chart regions
- stale frames
- rescaling artifacts

Do NOT "fix" vision by simply lowering quality thresholds.

Audit the actual extraction pipeline.

Verify that:

vision_kind

correctly reports CANDLE or AREA when possible.

Also verify that diagnostic values such as:

vision quality
coverage
continuity
anchors
horizontal rejects

are actually populated and useful.

==================================================
EVIDENCE ENGINE — CRITICAL
==================================================

A previous real test produced cases such as:

89 observations
89 vision-good observations
but only 3 usable observations

and therefore TOO_LITTLE_EVIDENCE.

This is a known architecture problem.

V2 is intended to fix it.

DO NOT revert to the old behavior where only instantaneous UP/DOWN observations count as evidence.

A visually valid WAIT observation can still contain useful trajectory and horizon evidence.

The Final Brain should evaluate the continuous timestamped trajectory and accumulated 2M/3M evidence.

However:

DO NOT simply make signals easier.

Bad/ambiguous evidence must still produce WAIT.

The goal is:

GOOD DATA should reach the Final Brain.

BAD DATA should be rejected.

