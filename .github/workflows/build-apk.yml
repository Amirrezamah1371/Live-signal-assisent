name: Build Live Signal Assistant 72.0.2

"on":
  push:
    branches:
      - main
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Build APK
        working-directory: build_src
        run: gradle --no-daemon assembleT60m1Debug assembleT60m5Debug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: LiveSignalAssistant-72.1.0-T60
          path: |
            build_src/app/build/outputs/apk/t60m1/debug/*.apk
            build_src/app/build/outputs/apk/t60m5/debug/*.apk
          if-no-files-found: error
