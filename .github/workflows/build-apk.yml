name: Build PRO MAX APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Extract PRO MAX source
        shell: bash
        run: |
          rm -rf "$GITHUB_WORKSPACE/promax-build"
          mkdir -p "$GITHUB_WORKSPACE/promax-build"

          ZIP="$GITHUB_WORKSPACE/LiveSignalAssistant_PRO_MAX_READY.zip"

          if [ ! -f "$ZIP" ]; then
            echo "ERROR: LiveSignalAssistant_PRO_MAX_READY.zip not found"
            exit 1
          fi

          unzip -q "$ZIP" -d "$GITHUB_WORKSPACE/promax-build"

      - name: Find and build Android project
        shell: bash
        run: |
          SETTINGS=$(find "$GITHUB_WORKSPACE/promax-build" -type f \( -name "settings.gradle" -o -name "settings.gradle.kts" \) | head -n 1)

          if [ -z "$SETTINGS" ]; then
            echo "ERROR: Android project not found inside ZIP"
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS")
          echo "Android project: $PROJECT_DIR"

          cd "$PROJECT_DIR"

          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
            ./gradlew assembleDebug --stacktrace
          else
            echo "Gradle wrapper not found - using installed Gradle"
            gradle assembleDebug --stacktrace
          fi

      - name: Collect APK
        shell: bash
        run: |
          APK=$(find "$GITHUB_WORKSPACE/promax-build" -type f -path "*/build/outputs/apk/debug/*.apk" | head -n 1)

          if [ -z "$APK" ]; then
            echo "ERROR: Debug APK not found"
            exit 1
          fi

          mkdir -p "$GITHUB_WORKSPACE/apk-output"
          cp "$APK" "$GITHUB_WORKSPACE/apk-output/LiveSignalAssistant-PRO-MAX.apk"

          echo "APK READY:"
          ls -lh "$GITHUB_WORKSPACE/apk-output/LiveSignalAssistant-PRO-MAX.apk"

      - name: Upload PRO MAX APK
        uses: actions/upload-artifact@v4
        with:
          name: LiveSignalAssistant-PRO-MAX-APK
          path: apk-output/LiveSignalAssistant-PRO-MAX.apk
          if-no-files-found: error
