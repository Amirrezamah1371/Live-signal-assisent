name: Build Trader Robot 71.7.27 DATA DRIVEN

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Prepare Android SDK
        shell: bash
        run: |
          set -euo pipefail

          echo "ANDROID_HOME=$ANDROID_HOME"

          SDKMANAGER=""

          if [ -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" ]; then
            SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          fi

          if [ -z "$SDKMANAGER" ]; then
            SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1 || true)
          fi

          if [ -z "$SDKMANAGER" ]; then
            SDKMANAGER=$(find "$ANDROID_HOME" -type f -name sdkmanager | head -n 1 || true)
          fi

          if [ -z "$SDKMANAGER" ]; then
            echo "sdkmanager not found"
            exit 1
          fi

          echo "Using sdkmanager: $SDKMANAGER"

          yes | "$SDKMANAGER" --licenses >/dev/null || true

          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Locate source ZIP
        id: source
        shell: bash
        run: |
          set -euo pipefail

          ZIP=$(find "$GITHUB_WORKSPACE" -type f -name "Trader_Robot_71.7.27_DATA_DRIVEN.zip" | head -n 1 || true)

          if [ -z "$ZIP" ]; then
            echo "ERROR: Trader_Robot_71.7.27_DATA_DRIVEN.zip not found"
            exit 1
          fi

          echo "Found source:"
          echo "$ZIP"

          unzip -t "$ZIP"

          echo "zip=$ZIP" >> "$GITHUB_OUTPUT"

      - name: Extract source
        shell: bash
        run: |
          set -euo pipefail

          DEST="$RUNNER_TEMP/trader-robot"

          rm -rf "$DEST"
          mkdir -p "$DEST"

          unzip -q "${{ steps.source.outputs.zip }}" -d "$DEST"

          echo "Source extracted to:"
          echo "$DEST"

      - name: Locate Android project
        id: project
        shell: bash
        run: |
          set -euo pipefail

          ROOT=""

          SETTINGS=$(find "$RUNNER_TEMP/trader-robot" -type f -name "settings.gradle" | head -n 1 || true)

          if [ -n "$SETTINGS" ]; then
            ROOT=$(dirname "$SETTINGS")
          fi

          if [ -z "$ROOT" ]; then
            SETTINGS=$(find "$RUNNER_TEMP/trader-robot" -type f -name "settings.gradle.kts" | head -n 1 || true)

            if [ -n "$SETTINGS" ]; then
              ROOT=$(dirname "$SETTINGS")
            fi
          fi

          if [ -z "$ROOT" ]; then
            echo "ERROR: Android project root not found"
            find "$RUNNER_TEMP/trader-robot" -maxdepth 4 -type f | sort
            exit 1
          fi

          echo "Android project root:"
          echo "$ROOT"

          echo "root=$ROOT" >> "$GITHUB_OUTPUT"

      - name: Build APK
        shell: bash
        working-directory: ${{ steps.project.outputs.root }}
        run: |
          set -euo pipefail

          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
            ./gradlew clean assembleDebug --stacktrace
          else
            gradle clean assembleDebug --stacktrace
          fi

      - name: Collect APK
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p "$GITHUB_WORKSPACE/apk-output"

          APK=$(find "${{ steps.project.outputs.root }}" -type f -path "*/build/outputs/apk/debug/*.apk" | head -n 1 || true)

          if [ -z "$APK" ]; then
            echo "ERROR: Debug APK not found"
            exit 1
          fi

          cp "$APK" "$GITHUB_WORKSPACE/apk-output/Trader-Robot-71.7.27.apk"

          echo "APK created:"
          ls -lh "$GITHUB_WORKSPACE/apk-output/Trader-Robot-71.7.27.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Trader-Robot-71.7.27
          path: apk-output/Trader-Robot-71.7.27.apk
          if-no-files-found: error
          retention-days: 30
