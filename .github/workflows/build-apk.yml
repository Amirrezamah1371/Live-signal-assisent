name: Build 71.7.27

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Find 71.7.27 source ZIP
        id: source
        shell: bash
        run: |
          set -euo pipefail

          ZIP="$(find . -maxdepth 2 -type f -name 'LiveSignalAssistant_71.7.27.zip' -print -quit)"

          if [ -z "$ZIP" ]; then
            echo "ERROR: LiveSignalAssistant_71.7.27.zip not found."
            echo "Available ZIP files:"
            find . -maxdepth 2 -type f -name '*.zip' -print || true
            exit 1
          fi

          echo "Found source: $ZIP"
          echo "zip=$ZIP" >> "$GITHUB_OUTPUT"

      - name: Test ZIP
        shell: bash
        run: |
          set -euo pipefail
          unzip -t "${{ steps.source.outputs.zip }}"

      - name: Extract source
        shell: bash
        run: |
          set -euo pipefail

          rm -rf "$RUNNER_TEMP/lsa71727"
          mkdir -p "$RUNNER_TEMP/lsa71727"

          unzip -q "${{ steps.source.outputs.zip }}" -d "$RUNNER_TEMP/lsa71727"

          echo "Source extracted successfully."
          find "$RUNNER_TEMP/lsa71727" -maxdepth 3 -type f | head -100

      - name: Locate Android project
        id: project
        shell: bash
        run: |
          set -euo pipefail

          SETTINGS="$(find "$RUNNER_TEMP/lsa71727" -type f -name 'settings.gradle' -print -quit)"

          if [ -z "$SETTINGS" ]; then
            SETTINGS="$(find "$RUNNER_TEMP/lsa71727" -type f -name 'settings.gradle.kts' -print -quit)"
          fi

          if [ -z "$SETTINGS" ]; then
            echo "ERROR: Android Gradle project not found."
            find "$RUNNER_TEMP/lsa71727" -maxdepth 6 -type f -print
            exit 1
          fi

          PROJECT_DIR="$(dirname "$SETTINGS")"

          echo "Android project: $PROJECT_DIR"
          echo "dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"

      - name: Inspect project
        shell: bash
        working-directory: ${{ steps.project.outputs.dir }}
        run: |
          set -euo pipefail

          echo "=== Project files ==="
          find . -maxdepth 3 -type f -name 'build.gradle' -print
          find . -maxdepth 3 -type f -name 'build.gradle.kts' -print
          find . -maxdepth 3 -type f -name 'gradle.properties' -print

          echo "=== Core Kotlin files ==="
          find . -type f -name 'SignalAnalyzer.kt' -print || true
          find . -type f -name 'CaptureService.kt' -print || true
          find . -type f -name 'MemoryStore.kt' -print || true
          find . -type f -name 'MainActivity.kt' -print || true

          echo "=== Manifest ==="
          find . -type f -name 'AndroidManifest.xml' -print

          echo "=== Version / Application ID ==="
          grep -R "applicationId" app/build.gradle app/build.gradle.kts 2>/dev/null || true
          grep -R "versionName" app/build.gradle app/build.gradle.kts 2>/dev/null || true

      - name: Build debug APK
        shell: bash
        working-directory: ${{ steps.project.outputs.dir }}
        run: |
          set -euo pipefail

          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
            ./gradlew clean assembleDebug --stacktrace --no-daemon
          else
            echo "Gradle wrapper not found. Using installed Gradle."
            gradle clean assembleDebug --stacktrace --no-daemon
          fi

      - name: Collect APK
        shell: bash
        working-directory: ${{ steps.project.outputs.dir }}
        run: |
          set -euo pipefail

          APK="$(find . -type f -path '*/build/outputs/apk/debug/*.apk' -print -quit)"

          if [ -z "$APK" ]; then
            echo "ERROR: Debug APK not found."
            find . -type f -name '*.apk' -print || true
            exit 1
          fi

          mkdir -p "$GITHUB_WORKSPACE/release"

          cp "$APK" "$GITHUB_WORKSPACE/release/LiveSignalAssistant-71.7.27.apk"

          echo "=== APK READY ==="
          ls -lh "$GITHUB_WORKSPACE/release/LiveSignalAssistant-71.7.27.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: LiveSignalAssistant-71.7.27
          path: release/LiveSignalAssistant-71.7.27.apk
          if-no-files-found: error
          retention-days: 30
