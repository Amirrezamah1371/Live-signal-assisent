Do not rewrite these components unnecessarily.


==================================================
VISION QUALITY


A major issue identified during previous memory analysis was possible confusion between the real chart/price trace and platform UI graphics.


The analyzer must distinguish actual price movement from:




trade lines


entry lines


horizontal UI lines


buttons


labels


overlay elements


countdown elements


transaction markers


other platform graphics




A single detected graphical line must never be treated as sufficient evidence of price direction.


Use temporal consistency across observations.


If visual extraction becomes unreliable or contradictory:


WAIT.


Never fabricate missing market information.


==================================================
ENTRY QUALITY


Improve protection against late entries.


Avoid issuing a continuation signal after most of the directional move has already happened.


Detect:




extended impulses


late continuation


momentum deceleration


exhaustion


abnormal recent displacement


poor risk/reward entry location


unstable reversals


conflicting structure




If a strong move has already occurred and the proposed entry would chase that move:


WAIT.


Do NOT automatically reverse direction just because the previous impulse appears exhausted.


==================================================
DIRECTION BALANCE


Eliminate artificial directional bias.


Do not prefer DOWN simply because previous observations were bearish.


Do not prefer UP simply because previous observations were bullish.


UP and DOWN should require comparable evidence.


Direction must emerge from current observed market structure.


==================================================
MULTI-OBSERVATION REASONING


Do not make the final decision from a single screenshot.


Use observations collected throughout the cycle.


Recent observations may receive more relevance, but one late frame must not completely override the entire cycle without strong structural evidence.


Evaluate:




persistence


acceleration/deceleration


structure


direction consistency


reversals


noise


impulse maturity


entry timing




The objective is to understand what the market is doing NOW and whether a new entry still has enough remaining movement.


==================================================
SUPPORTED EXPIRIES


ONLY use:


1 minute
4 minutes
5 minutes


Do NOT use:


30 seconds
2 minutes
3 minutes


Select expiry according to setup structure.


Short immediate setups may use 1m.


More developed structural setups may use 4m or 5m.


Do not choose expiry randomly.


==================================================
SCORE SYSTEM


The internal SCORE is diagnostic.


It is NOT a calibrated probability of winning.


Display:


SCORE: XX


Never display:


XX%
Confidence XX%
Win Probability XX%


Do not interpret SCORE 96 as a 96% probability of winning.


Do not artificially saturate most accepted signals at the same score.


The score should meaningfully reflect differences in evidence quality.


==================================================
WAIT-FIRST FILTERING


Prefer WAIT when:




structure is unclear


direction conflicts


momentum is weak


momentum is exhausted


entry is late


price already made a large impulse


visual quality is unreliable


chart/UI contamination is suspected


evidence is insufficient


expiry selection is uncertain


UP and DOWN evidence are too close




There is NO signal quota.


There is NO requirement to generate a certain number of signals per hour.


