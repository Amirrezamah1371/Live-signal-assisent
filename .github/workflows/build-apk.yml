name: Build Trader Robot 71.7.27

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Prepare Android SDK
        shell: bash
        run: |
          set -e

          echo "ANDROID_HOME=$ANDROID_HOME"

          SDKMANAGER=""

          if [ -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" ]; then
            SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          fi

          if [ -z "$SDKMANAGER" ]; then
            SDKMANAGER=$(find "$ANDROID_HOME" -type f -name sdkmanager | head -n 1)
          fi

          if [ -z "$SDKMANAGER" ]; then
            echo "sdkmanager not found"
            exit 1
          fi

          yes | "$SDKMANAGER" --licenses >/dev/null || true

          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Locate source ZIP
        id: source
        shell: bash
        run: |
          set -e

          ZIP=$(find . -type f -name "Trader_Robot_71.7.27.zip" | head -n 1)

          if [ -z "$ZIP" ]; then
            echo "Trader_Robot_71.7.27.zip not found"
            find . -maxdepth 3 -type f
            exit 1
          fi

          echo "Found source: $ZIP"
          echo "zip=$ZIP" >> "$GITHUB_OUTPUT"

      - name: Verify source ZIP
        shell: bash
        run: |
          set -e
          unzip -t "${{ steps.source.outputs.zip }}"

      - name: Extract source
        shell: bash
        run: |
          set -e

          rm -rf "$RUNNER_TEMP/trader-robot"
          mkdir -p "$RUNNER_TEMP/trader-robot"

          unzip -q "${{ steps.source.outputs.zip }}" \
            -d "$RUNNER_TEMP/trader-robot"

      - name: Locate Android project
        id: project
        shell: bash
        run: |
          set -e

          SETTINGS=$(find "$RUNNER_TEMP/trader-robot" -type f -name "settings.gradle" | head -n 1)

          if [ -z "$SETTINGS" ]; then
            SETTINGS=$(find "$RUNNER_TEMP/trader-robot" -type f -name "settings.gradle.kts" | head -n 1)
          fi

          if [ -z "$SETTINGS" ]; then
            echo "Android Gradle project not found"
            find "$RUNNER_TEMP/trader-robot" -maxdepth 5 -type f
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS")

          echo "Project directory: $PROJECT_DIR"
          echo "dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"

      - name: Build APK
        shell: bash
        working-directory: ${{ steps.project.outputs.dir }}
        run: |
          set -e

          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
            ./gradlew clean assembleDebug --stacktrace
          else
            gradle clean assembleDebug --stacktrace
          fi

      - name: Collect APK
        shell: bash
        run: |
          set -e

          APK=$(find "${{ steps.project.outputs.dir }}" -type f -name "*debug*.apk" | head -n 1)

          if [ -z "$APK" ]; then
            echo "Debug APK not found"
            find "${{ steps.project.outputs.dir }}" -type f -name "*.apk"
            exit 1
          fi

          mkdir -p "$GITHUB_WORKSPACE/apk-output"

          cp "$APK" \
            "$GITHUB_WORKSPACE/apk-output/Trader-Robot-71.7.27.apk"

          ls -lh "$GITHUB_WORKSPACE/apk-output/Trader-Robot-71.7.27.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Trader-Robot-71.7.27
          path: apk-output/Trader-Robot-71.7.27.apk
          if-no-files-found: error
          retention-days: 30
