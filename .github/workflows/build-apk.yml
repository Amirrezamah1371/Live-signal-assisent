Modify the existing LiveSignalAssistant_BALANCED_v2 Android project.

DO NOT rebuild the application from scratch.
DO NOT remove or break any currently working feature.
Preserve the existing overlay, pair detection, timer, trade detection, trade locking, and screen/chart monitoring.

The current version is much better, but it has four important problems:

1. It stays in WAIT far too long and misses valid opportunities.
2. Sometimes it becomes biased toward only UP or only DOWN.
3. Some signals are generated too late, after the useful entry point has already passed.
4. We need automatic WIN/LOSS tracking for trades that the user actually opens.

The purpose of this update is NOT to force trades.
The purpose is to continuously analyze the visible chart, detect valid opportunities faster, evaluate UP and DOWN independently, select an appropriate 1m/2m/3m expiry, and avoid unnecessary WAIT states.

There is NO guaranteed winning signal.
Never generate a signal merely because time has passed.

==================================================
1. CONTINUOUS REAL-TIME ANALYSIS
==================================================

Analyze the visible chart continuously.

Run a new analysis approximately every 500–750 ms.

Maintain a rolling history of approximately the most recent 20–40 detected chart/price observations.

Do NOT make a trading decision from one isolated screenshot or one single point.

Continuously calculate:

- immediate price direction
- short-term momentum
- medium-term momentum
- acceleration
- deceleration
- recent swing highs
- recent swing lows
- higher highs
- higher lows
- lower highs
- lower lows
- local support
- local resistance
- breakout attempts
- breakdown attempts
- support rejection
- resistance rejection
- pullbacks
- retests
- reversal structure
- continuation structure
- current volatility
- abnormal spikes
- distance from recent mean
- distance from recent swing extremes

The analysis must continuously update as the visible chart changes.

==================================================
2. INDEPENDENT UP AND DOWN ENGINES
==================================================

This is CRITICAL.

On EVERY analysis cycle calculate independently:

upScore = 0..100
downScore = 0..100

UP and DOWN must NEVER depend on each other.

DO NOT use:

if bullish -> UP
else -> DOWN

DO NOT use previousDirection to determine the next direction.

DO NOT alternate UP and DOWN artificially.

DO NOT suppress UP because previous signals were UP.

DO NOT suppress DOWN because previous signals were DOWN.

Every cycle must evaluate BOTH directions from zero using the current chart data.

The market/chart must determine the direction.

==================================================
3. UP SCORE
==================================================

Increase upScore when bullish evidence exists.

Bullish evidence can include:

- higher lows
- higher highs
- positive short momentum
- positive medium momentum
- bullish acceleration
- rejection upward from support
- bullish reversal after a decline
- breakout above recent resistance
- breakout followed by successful retest
- pullback followed by upward continuation
- recovery after a temporary downward extension
- failed bearish breakdown
- price reclaiming a recently lost level

Multiple moderate confirmations should be capable of producing a valid UP signal.

DO NOT require every bullish condition simultaneously.

==================================================
4. DOWN SCORE
==================================================

Increase downScore when bearish evidence exists.

Bearish evidence can include:

- lower highs
- lower lows
- negative short momentum
- negative medium momentum
- bearish acceleration
- rejection downward from resistance
- bearish reversal after a rise
- breakdown below recent support
- breakdown followed by failed retest
- pullback followed by downward continuation
- rejection after temporary upward extension
- failed bullish breakout
- price losing a recently defended level

Multiple moderate confirmations should be capable of producing a valid DOWN signal.

DO NOT require every bearish condition simultaneously.

==================================================
5. WEIGHTED SCORING
==================================================

Replace excessive all-or-nothing confirmation logic with weighted scoring.

Suggested starting weights:

Momentum confirmation: +18
Market structure confirmation: +16
Support/resistance reaction: +16
Breakout or breakdown + retest: +18
Reversal confirmation: +16
Continuation confirmation: +12
Acceleration confirmation: +10
Suitable volatility: +8

Do not require all components.

The scoring must be symmetrical for UP and DOWN.

Suggested normal signal threshold:

62

Strong signal threshold:

72

Generate WAIT when:

max(upScore, downScore) < 62

OR

abs(upScore - downScore) < 8

OR

the market is genuinely noisy, unstable, or ambiguous.

Do NOT output WAIT merely because one confirmation is missing.

==================================================
6. ADAPTIVE THRESHOLD
==================================================

Do not use an excessively rigid threshold.

Normal market:

approximately 62

Clean structure with several independent confirmations:

approximately 60–62 may be accepted.

Noisy/choppy market:

increase threshold toward approximately 68–72.

IMPORTANT:

Never reduce the threshold merely because the application has not produced a signal recently.

No-signal duration must NEVER force a trade.

The application should actively search for opportunities continuously, but it must not manufacture them.

==================================================
7. DO NOT MISS VALID OPPORTUNITIES
==================================================

The current version is too conservative.

A valid setup does NOT need every possible confirmation.

If several independent pieces of evidence agree strongly enough, allow the signal.

For example:

good structure
+
good momentum
+
support/resistance reaction

may be sufficient even if there is no breakout.

Likewise:

breakout
+
momentum
+
successful retest

may be sufficient without requiring a reversal pattern.

Evaluate combinations rather than requiring one fixed pattern.

==================================================
8. ENTRY TIMING
==================================================

Entry timing is extremely important.

Do not generate a signal after most of the expected move has already happened.

Reject obviously late entries where price is excessively extended from recent structure.

Prefer entries around:

reversal + confirmation
breakout + confirmation
breakdown + confirmation
retest + continuation
pullback + continuation
support rejection
resistance rejection
failed breakout
failed breakdown

Once a valid entry appears, publish it promptly.

Do NOT wait for so many additional confirmations that the useful entry point disappears.

==================================================
9. SIGNAL STABILITY
==================================================

To reduce one-frame noise:

A candidate UP or DOWN setup should remain valid for approximately 2 consecutive analysis cycles before publishing.

Do NOT require long confirmation windows.

The purpose is only to reject momentary visual noise.

==================================================
10. EXPIRY ENGINE
==================================================

Evaluate all six possibilities independently:

UP 1m
UP 2m
UP 3m

DOWN 1m
DOWN 2m
DOWN 3m

Each candidate should receive its own suitability score.

Then select the highest valid combination of:

direction + expiry.

General guidance:

Fast immediate momentum or confirmed short reversal:
consider 1m

Normal continuation, breakout, breakdown or retest:
consider 2m

Slower structure or larger swing:
consider 3m

Do NOT always choose the same expiry.

Do NOT select expiry randomly.

Expiry must be based on the speed and structure of the detected move.

==================================================
11. PREVENT LATE SIGNALS
==================================================

Before publishing a signal, estimate whether the move has already become overextended.

If a large percentage of the expected short-term movement appears to have already occurred:

WAIT for a pullback/retest/new setup instead of chasing the move.

A signal appearing at the very end of an already completed movement should be rejected.

==================================================
12. TRADE DETECTION AND LOCKING
==================================================

Displaying UP or DOWN must NOT immediately lock the engine.

After displaying a signal:

continue monitoring the Pocket Option screen.

If the user does NOT open the trade:

DO NOT lock.

Continue analyzing.

If the setup becomes invalid before entry:

cancel the displayed opportunity,
return to WAIT,
and search for another entry.

ONLY lock after the application detects that the user actually opened a trade.

When a real trade is detected:

LOCK the current trade.

Store:

direction
expiry
entry time
entry price if detectable
UP score
DOWN score

During the active trade display:

LOCKED • UP • 1m

or

LOCKED • DOWN • 2m

etc.

Do not generate another signal while the detected trade is active.

After the trade expires:

unlock automatically
and immediately resume analysis.

==================================================
13. AUTOMATIC TRADE RESULT TRACKING
==================================================

Track only trades that the application actually detected as opened by the user.

A displayed signal that the user ignored must NOT count as a trade.

After an opened trade reaches expiry, determine:

WIN
LOSS
DRAW

using the detected entry and expiry result when technically available.

Maintain session statistics:

Total Trades
Wins
Losses
Draws
Win Rate

For example:

Trades: 8
W: 6
L: 2
D: 0
Win Rate: 75%

Display compact statistics in the overlay.

Example while analyzing:

WAIT • ANALYZING
W 6 | L 2 | 75%

Example while showing a signal:

↑ UP • 2m
UP 71 | DOWN 34
W 6 | L 2 | 75%

Example during an active trade:

LOCKED • UP • 2m
W 6 | L 2 | 75%

After expiry:

1. determine result
2. update WIN/LOSS/DRAW
3. update win rate
4. unlock
5. immediately resume analysis

If the application cannot reliably determine the trade result from the visible screen, DO NOT guess the result.

==================================================
