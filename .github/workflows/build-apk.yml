name: Build Live Signal Assistant Shock Brain

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Extract Shock Brain source
        shell: bash
        run: |
          set -euo pipefail

          ZIP="$(find "$GITHUB_WORKSPACE" -maxdepth 1 -type f -name '*SHOCK_BRAIN*.zip' -print -quit)"

          if [ -z "$ZIP" ]; then
            echo "::error::SHOCK_BRAIN source ZIP not found"
            exit 1
          fi

          DEST="$RUNNER_TEMP/shock-brain-source"
          rm -rf "$DEST"
          mkdir -p "$DEST"
          unzip -q "$ZIP" -d "$DEST"

          SETTINGS="$(find "$DEST" -type f \( -name 'settings.gradle' -o -name 'settings.gradle.kts' \) -print -quit)"

          if [ -z "$SETTINGS" ]; then
            echo "::error::Gradle settings file not found inside ZIP"
            exit 1
          fi

          PROJECT_DIR="$(dirname "$SETTINGS")"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Android project found at: $PROJECT_DIR"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Build debug APK
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"

          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
            ./gradlew --no-daemon assembleDebug
          else
            gradle --no-daemon assembleDebug
          fi

      - name: Collect APK
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p "$GITHUB_WORKSPACE/apk-output"

          APK="$(find "$PROJECT_DIR" -type f -name '*.apk' -path '*/build/outputs/apk/*' -print -quit)"

          if [ -z "$APK" ]; then
            echo "::error::Build completed but APK was not found"
            exit 1
          fi

          cp "$APK" "$GITHUB_WORKSPACE/apk-output/LiveSignalAssistant-71.7.27-1M-SHOCK-BRAIN.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: LiveSignalAssistant-71.7.27-1M-SHOCK-BRAIN
          path: apk-output/LiveSignalAssistant-71.7.27-1M-SHOCK-BRAIN.apk
          if-no-files-found: error
