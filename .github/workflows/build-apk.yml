Support/Resistance score
Reversal score
Continuation score
Breakout/Breakdown score
Volatility state

This information is required for later tuning.

Previous WIN/LOSS results are diagnostic data only.

NEVER make the next trade UP or DOWN simply because previous trades won or lost.

