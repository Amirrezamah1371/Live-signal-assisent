name: Build COHERENT ADAPTIVE 6.3.0

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Verify source ZIP
        shell: bash
        run: |
          set -e

          ZIP_FILE="$GITHUB_WORKSPACE/LiveSignalAssistant_COHERENT_ADAPTIVE_630.zip"

          if [ ! -f "$ZIP_FILE" ]; then
            echo "ERROR: LiveSignalAssistant_COHERENT_ADAPTIVE_630.zip not found."
            echo "Repository contents:"
            ls -la "$GITHUB_WORKSPACE"
            exit 1
          fi

          unzip -t "$ZIP_FILE"
          echo "SOURCE ZIP OK"

      - name: Extract project
        shell: bash
        run: |
          set -e

          ZIP_FILE="$GITHUB_WORKSPACE/LiveSignalAssistant_COHERENT_ADAPTIVE_630.zip"
          BUILD_DIR="$GITHUB_WORKSPACE/coherent-adaptive-630-build"

          rm -rf "$BUILD_DIR"
          mkdir -p "$BUILD_DIR"

          unzip -q "$ZIP_FILE" -d "$BUILD_DIR"

          echo "Project extracted successfully."

      - name: Locate Android project
        id: project
        shell: bash
        run: |
          set -e

          BUILD_DIR="$GITHUB_WORKSPACE/coherent-adaptive-630-build"

          SETTINGS_FILE=$(find "$BUILD_DIR" -type f -name "settings.gradle" | head -1)

          if [ -z "$SETTINGS_FILE" ]; then
            SETTINGS_FILE=$(find "$BUILD_DIR" -type f -name "settings.gradle.kts" | head -1)
          fi

          if [ -z "$SETTINGS_FILE" ]; then
            echo "ERROR: settings.gradle/settings.gradle.kts not found."
            find "$BUILD_DIR" -maxdepth 6 -type f | sort
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS_FILE")

          if [ ! -d "$PROJECT_DIR/app" ]; then
            echo "ERROR: app module not found."
            exit 1
          fi

          echo "Android project: $PROJECT_DIR"
          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"

      - name: Verify source files
        shell: bash
        run: |
          set -e

          PROJECT_DIR="${{ steps.project.outputs.project_dir }}"

          SIGNAL_ANALYZER=$(find "$PROJECT_DIR/app/src" -type f -name "SignalAnalyzer.kt" | head -1)
          CAPTURE_SERVICE=$(find "$PROJECT_DIR/app/src" -type f -name "CaptureService.kt" | head -1)

          if [ -z "$SIGNAL_ANALYZER" ]; then
            echo "ERROR: SignalAnalyzer.kt not found."
            exit 1
          fi

          if [ -z "$CAPTURE_SERVICE" ]; then
            echo "ERROR: CaptureService.kt not found."
            exit 1
          fi

          echo "SignalAnalyzer: $SIGNAL_ANALYZER"
          echo "CaptureService: $CAPTURE_SERVICE"

      - name: Show application information
        shell: bash
        run: |
          set -e

          PROJECT_DIR="${{ steps.project.outputs.project_dir }}"

          BUILD_FILE="$PROJECT_DIR/app/build.gradle.kts"

          if [ ! -f "$BUILD_FILE" ]; then
            BUILD_FILE="$PROJECT_DIR/app/build.gradle"
          fi

          if [ ! -f "$BUILD_FILE" ]; then
            echo "ERROR: app Gradle file not found."
            exit 1
          fi

          echo "========================================"
          echo "APPLICATION INFORMATION"
          echo "========================================"

          grep -n "applicationId" "$BUILD_FILE" || true
          grep -n "versionCode" "$BUILD_FILE" || true
          grep -n "versionName" "$BUILD_FILE" || true

      - name: Build APK
        shell: bash
        run: |
          set -e

          PROJECT_DIR="${{ steps.project.outputs.project_dir }}"
          cd "$PROJECT_DIR"

          echo "========================================"
          echo "BUILDING COHERENT ADAPTIVE 6.3.0"
          echo "========================================"

          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
            ./gradlew clean assembleDebug --stacktrace --no-daemon
          else
            gradle clean assembleDebug --stacktrace --no-daemon
          fi

      - name: Collect APK
        shell: bash
        run: |
          set -e

          PROJECT_DIR="${{ steps.project.outputs.project_dir }}"

          APK_FILE=$(find "$PROJECT_DIR/app/build/outputs/apk" -type f -name "*.apk" | head -1)

          if [ -z "$APK_FILE" ]; then
            echo "ERROR: APK not generated."
            find "$PROJECT_DIR" -type f -name "*.apk" || true
            exit 1
          fi

          mkdir -p "$GITHUB_WORKSPACE/apk-output"

          OUTPUT_APK="$GITHUB_WORKSPACE/apk-output/LiveSignalAssistant-COHERENT-ADAPTIVE-6.3.0.apk"

          cp "$APK_FILE" "$OUTPUT_APK"

          echo "========================================"
          echo "APK BUILD SUCCESSFUL"
          echo "========================================"

          ls -lh "$OUTPUT_APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: LiveSignalAssistant-COHERENT-ADAPTIVE-6.3.0
          path: apk-output/LiveSignalAssistant-COHERENT-ADAPTIVE-6.3.0.apk
          if-no-files-found: error
          retention-days: 30
