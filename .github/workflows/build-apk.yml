name: Build V5.5 PRECISION EVOLUTION

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Verify source ZIP
        shell: bash
        run: |
          ZIP="$GITHUB_WORKSPACE/LiveSignalAssistant_V5_5_PRECISION_EVOLUTION.zip"

          if [ ! -f "$ZIP" ]; then
            echo "ERROR: ZIP NOT FOUND"
            echo "$ZIP"
            echo ""
            echo "Repository files:"
            ls -lah "$GITHUB_WORKSPACE"
            exit 1
          fi

          echo "Source ZIP found:"
          ls -lh "$ZIP"

          echo "Checking ZIP integrity..."
          unzip -t "$ZIP"

      - name: Extract V5.5 PRECISION EVOLUTION
        shell: bash
        run: |
          BUILD_DIR="$GITHUB_WORKSPACE/v55-precision-evolution-build"

          rm -rf "$BUILD_DIR"
          mkdir -p "$BUILD_DIR"

          unzip -q \
            "$GITHUB_WORKSPACE/LiveSignalAssistant_V5_5_PRECISION_EVOLUTION.zip" \
            -d "$BUILD_DIR"

          echo "Extraction completed."

      - name: Find Android project
        shell: bash
        run: |
          BUILD_DIR="$GITHUB_WORKSPACE/v55-precision-evolution-build"

          SETTINGS=$(find "$BUILD_DIR" -type f -name "settings.gradle" -print -quit)

          if [ -z "$SETTINGS" ]; then
            SETTINGS=$(find "$BUILD_DIR" -type f -name "settings.gradle.kts" -print -quit)
          fi

          if [ -z "$SETTINGS" ]; then
            echo "ERROR: Android project not found."
            echo ""
            echo "Extracted files:"
            find "$BUILD_DIR" -maxdepth 6 -type f | sort
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS")

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo "Android project:"
          echo "$PROJECT_DIR"

      - name: Verify project
        shell: bash
        run: |
          if [ ! -d "$PROJECT_DIR" ]; then
            echo "ERROR: PROJECT_DIR does not exist."
            exit 1
          fi

          echo "Project directory:"
          ls -lah "$PROJECT_DIR"

          if [ ! -d "$PROJECT_DIR/app" ]; then
            echo "ERROR: app module not found."
            exit 1
          fi

      - name: Build V5.5 PRECISION EVOLUTION APK
        shell: bash
        run: |
          cd "$PROJECT_DIR"

          if [ -f "./gradlew" ]; then
            echo "Using Gradle Wrapper"
            chmod +x ./gradlew
            ./gradlew --version
            ./gradlew clean assembleDebug --stacktrace
          else
            echo "Gradle Wrapper not found."
            echo "Using installed Gradle."
            gradle --version
            gradle clean assembleDebug --stacktrace
          fi

      - name: Find generated APK
        shell: bash
        run: |
          BUILD_DIR="$GITHUB_WORKSPACE/v55-precision-evolution-build"

          APK=$(find "$BUILD_DIR" \
            -type f \
            -path "*/build/outputs/apk/debug/*.apk" \
            -print -quit)

          if [ -z "$APK" ]; then
            echo "Standard debug APK not found."
            echo "Searching all APK files..."

            APK=$(find "$BUILD_DIR" \
              -type f \
              -name "*.apk" \
              -print -quit)
          fi

          if [ -z "$APK" ]; then
            echo "ERROR: APK NOT FOUND."
            echo ""
            echo "Build output:"
            find "$BUILD_DIR" -type d -path "*/build/outputs*" -print || true
            exit 1
          fi

          echo "APK_PATH=$APK" >> "$GITHUB_ENV"

          echo "APK generated successfully:"
          ls -lh "$APK"

      - name: Prepare final APK
        shell: bash
        run: |
          OUTPUT_DIR="$GITHUB_WORKSPACE/apk-output"

          rm -rf "$OUTPUT_DIR"
          mkdir -p "$OUTPUT_DIR"

          FINAL_APK="$OUTPUT_DIR/LiveSignalAssistant-V5.5-PRECISION-EVOLUTION.apk"

          cp "$APK_PATH" "$FINAL_APK"

          if [ ! -s "$FINAL_APK" ]; then
            echo "ERROR: Final APK is missing or empty."
            exit 1
          fi

          echo "Final APK:"
          ls -lh "$FINAL_APK"

      - name: Upload V5.5 PRECISION EVOLUTION APK
        uses: actions/upload-artifact@v4
        with:
          name: LiveSignalAssistant-V5.5-PRECISION-EVOLUTION
          path: apk-output/LiveSignalAssistant-V5.5-PRECISION-EVOLUTION.apk
          if-no-files-found: error
          retention-days: 30
