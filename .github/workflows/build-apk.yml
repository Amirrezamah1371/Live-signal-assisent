name: Build V5.5 MATURE APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Extract source
        shell: bash
        run: |
          rm -rf "$GITHUB_WORKSPACE/v55-build"
          mkdir -p "$GITHUB_WORKSPACE/v55-build"
          unzip -q "$GITHUB_WORKSPACE/LiveSignalAssistant_V5_5_MATURE_RESTORED.zip" -d "$GITHUB_WORKSPACE/v55-build"

      - name: Find and build Android project
        shell: bash
        run: |
          SETTINGS=$(find "$GITHUB_WORKSPACE/v55-build" -type f \( -name "settings.gradle" -o -name "settings.gradle.kts" \) | head -n 1)

          if [ -z "$SETTINGS" ]; then
            echo "ERROR: Android project not found"
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS")
          echo "Android project: $PROJECT_DIR"

          cd "$PROJECT_DIR"

          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
            ./gradlew assembleDebug --stacktrace
          else
            echo "Gradle wrapper not found - using installed Gradle"
            gradle assembleDebug --stacktrace
          fi

      - name: Collect APK
        shell: bash
        run: |
          APK=$(find "$GITHUB_WORKSPACE/v55-build" -type f -path "*/build/outputs/apk/debug/*.apk" | head -n 1)

          if [ -z "$APK" ]; then
            echo "ERROR: APK not found"
            exit 1
          fi

          mkdir -p "$GITHUB_WORKSPACE/apk-output"
          cp "$APK" "$GITHUB_WORKSPACE/apk-output/LiveSignalAssistant-V5.5-MATURE.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: LiveSignalAssistant-V5-5-MATURE-APK
          path: apk-output/LiveSignalAssistant-V5.5-MATURE.apk
          if-no-files-found: error
