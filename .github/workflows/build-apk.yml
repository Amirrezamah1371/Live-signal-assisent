name: Build ONE DECISION MEMORY 7.0

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Find 7.0 source ZIP
        id: source
        shell: bash
        run: |
          set -euo pipefail

          ZIP="$(find . -maxdepth 2 -type f -name 'LiveSignalAssistant_7_0_ONE_DECISION_MEMORY.zip' -print -quit)"

          if [ -z "$ZIP" ]; then
            echo "ERROR: LiveSignalAssistant_7_0_ONE_DECISION_MEMORY.zip not found."
            echo "ZIP files currently in repository:"
            find . -maxdepth 2 -type f -name '*.zip' -print || true
            exit 1
          fi

          echo "Found source: $ZIP"
          echo "zip=$ZIP" >> "$GITHUB_OUTPUT"

      - name: Extract source
        shell: bash
        run: |
          set -euo pipefail

          rm -rf "$RUNNER_TEMP/lsa70"
          mkdir -p "$RUNNER_TEMP/lsa70"

          unzip -q "${{ steps.source.outputs.zip }}" -d "$RUNNER_TEMP/lsa70"

          echo "Extracted source:"
          find "$RUNNER_TEMP/lsa70" -maxdepth 3 -type f | head -100

      - name: Locate Android project
        id: project
        shell: bash
        run: |
          set -euo pipefail

          SETTINGS="$(find "$RUNNER_TEMP/lsa70" -type f -name 'settings.gradle' -print -quit)"

          if [ -z "$SETTINGS" ]; then
            SETTINGS="$(find "$RUNNER_TEMP/lsa70" -type f -name 'settings.gradle.kts' -print -quit)"
          fi

          if [ -z "$SETTINGS" ]; then
            echo "ERROR: Android Gradle project not found."
            echo "Extracted files:"
            find "$RUNNER_TEMP/lsa70" -maxdepth 5 -type f -print
            exit 1
          fi

          PROJECT_DIR="$(dirname "$SETTINGS")"

          echo "Android project: $PROJECT_DIR"
          echo "dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"

      - name: Inspect project
        shell: bash
        working-directory: ${{ steps.project.outputs.dir }}
        run: |
          set -euo pipefail

          echo "=== Gradle files ==="
          find . -maxdepth 3 -type f \( -name 'build.gradle' -o -name 'build.gradle.kts' -o -name 'gradle.properties' \) -print

          echo "=== Android source files ==="
          find . -type f -name '*.kt' -print | head -100 || true

          echo "=== Manifest ==="
          find . -type f -name 'AndroidManifest.xml' -print

      - name: Build debug APK
        shell: bash
        working-directory: ${{ steps.project.outputs.dir }}
        run: |
          set -euo pipefail

          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
            ./gradlew clean assembleDebug --stacktrace --no-daemon
          else
            echo "Gradle wrapper not found; using installed Gradle."
            gradle clean assembleDebug --stacktrace --no-daemon
          fi

      - name: Collect APK
        id: apk
        shell: bash
        working-directory: ${{ steps.project.outputs.dir }}
        run: |
          set -euo pipefail

          APK="$(find . -type f -path '*/build/outputs/apk/debug/*.apk' -print -quit)"

          if [ -z "$APK" ]; then
            echo "ERROR: Build finished but debug APK was not found."
            find . -type f -name '*.apk' -print || true
            exit 1
          fi

          mkdir -p "$GITHUB_WORKSPACE/release"

          cp "$APK" "$GITHUB_WORKSPACE/release/LiveSignalAssistant-ONE-DECISION-MEMORY-7.0.apk"

          echo "APK created:"
          ls -lh "$GITHUB_WORKSPACE/release/LiveSignalAssistant-ONE-DECISION-MEMORY-7.0.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: LiveSignalAssistant-ONE-DECISION-MEMORY-7.0
          path: release/LiveSignalAssistant-ONE-DECISION-MEMORY-7.0.apk
          if-no-files-found: error
          retention-days: 30
