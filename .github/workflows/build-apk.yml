name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "LiveSignalAssistant_overlay_fixed.zip"
      - ".github/workflows/build-apk.yml"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify project ZIP
        shell: bash
        run: |
          if [ ! -f "LiveSignalAssistant_overlay_fixed.zip" ]; then
            echo "ERROR: LiveSignalAssistant_overlay_fixed.zip not found"
            exit 1
          fi
          echo "ZIP found successfully"

      - name: Extract project
        shell: bash
        run: |
          rm -rf extracted
          mkdir extracted
          unzip -q "LiveSignalAssistant_overlay_fixed.zip" -d extracted
          echo "ZIP extracted successfully"
          find extracted -maxdepth 4 -type f | head -100

      - name: Find Android project
        id: project
        shell: bash
        run: |
          SETTINGS=$(find extracted -type f \( -name "settings.gradle" -o -name "settings.gradle.kts" \) | head -1)
          if [ -z "$SETTINGS" ]; then
            echo "ERROR: settings.gradle/settings.gradle.kts not found"
            find extracted -maxdepth 5 -type f
            exit 1
          fi
          PROJECT_DIR=$(dirname "$SETTINGS")
          echo "Android project found at: $PROJECT_DIR"
          echo "dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"
          if [ ! -d "$PROJECT_DIR/app" ]; then
            echo "ERROR: app directory not found"
            exit 1
          fi

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Configure Java 17 compatibility
        shell: bash
        run: |
          PROJECT_DIR="${{ steps.project.outputs.dir }}"
          BUILD_FILE="$PROJECT_DIR/app/build.gradle"

          if [ -f "$BUILD_FILE" ]; then
            printf '\nandroid {\n    compileOptions {\n        sourceCompatibility JavaVersion.VERSION_17\n        targetCompatibility JavaVersion.VERSION_17\n    }\n}\n\ntasks.withType(org.jetbrains.kotlin.gradle.tasks.KotlinCompile).configureEach {\n    kotlinOptions {\n        jvmTarget = "17"\n    }\n}\n' >> "$BUILD_FILE"
            echo "Java/Kotlin compatibility configured"
          else
            echo "app/build.gradle not found; skipping compatibility patch"
          fi

      - name: Build APK
        shell: bash
        run: |
          PROJECT_DIR="${{ steps.project.outputs.dir }}"
          cd "$PROJECT_DIR"
          echo "Building project from: $(pwd)"

          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
            ./gradlew --no-daemon clean assembleDebug
          else
            gradle --no-daemon clean assembleDebug
          fi

      - name: Locate APK
        id: apk
        shell: bash
        run: |
          PROJECT_DIR="${{ steps.project.outputs.dir }}"
          APK=$(find "$PROJECT_DIR" -type f -path "*/build/outputs/apk/debug/*.apk" | head -1)

          if [ -z "$APK" ]; then
            echo "ERROR: APK not found"
            find "$PROJECT_DIR" -type f -name "*.apk"
            exit 1
          fi

          echo "APK generated: $APK"
          echo "path=$APK" >> "$GITHUB_OUTPUT"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: LiveSignalAssistant-APK
          path: ${{ steps.apk.outputs.path }}
          if-no-files-found: error
