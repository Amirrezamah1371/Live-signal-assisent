==================================================

Do NOT present model_score as a calibrated probability.

Do NOT recreate the old behavior where most signals saturate at 96.

Do NOT label a score of 96 as "96% probability of winning".

Audit score saturation and clipping.

Strength/confidence must decrease when:

vision quality is poor,
features disagree,
trajectory is stale,
regime is unstable,
sample evidence is weak,
or 2M/3M predictions conflict.

==================================================
PERMANENT EXPERIENCE MEMORY
==================================================

THIS FEATURE IS MANDATORY.

The bot MUST retain permanent Experience learning.

2M and 3M outcomes must be learned separately.

A 2M result must not be treated as a 3M training result and vice versa.

WIN and LOSS update Experience.

VOID MUST NOT train Experience.

Experience should act as a learned critic/adjustment layer, not blindly dominate live evidence.

Avoid overfitting to tiny sample sizes.

Use smoothing/priors and require meaningful historical evidence before Experience can strongly alter a live decision.

Experience storage must remain compact.

Do NOT store unlimited screenshots in permanent Experience.

Normal session screenshots/diagnostics may be exported separately.

CRITICAL:

There must be NO normal in-app button, menu, or session-clear operation that deletes Experience.

"Clear session" must NOT delete permanent Experience.

The permanent Experience data should survive normal app restarts and normal APK updates when Android preserves app-private data.

Do not falsely claim that Experience can survive Android uninstall or OS-level "Clear App Data".

Do NOT change the applicationId unnecessarily because that can break Android private-data continuity.

