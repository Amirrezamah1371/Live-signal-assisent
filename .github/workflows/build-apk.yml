Modify the existing Live Signal Assistant project without changing the working overlay UI, screen-capture system, permissions, or other currently stable features.

The current version is significantly better, but the signal engine still develops directional bias: sometimes it produces almost only DOWN signals, while previous versions produced almost only UP signals. Fix this at the architecture level, not by simply adding an artificial UP/DOWN balance or alternating directions.

REQUIRED SIGNAL ENGINE:

1. Create six completely independent candidates on every analysis cycle:
   - UP 1m
   - UP 2m
   - UP 3m
   - DOWN 1m
   - DOWN 2m
   - DOWN 3m

2. Recalculate all six candidates from zero on every analysis cycle.

3. UP and DOWN must use mathematically symmetrical mirrored logic. Never favor a direction because previous signals were UP or DOWN. Never artificially alternate signals.

4. Overall market trend must be only ONE input. Trend alone must NEVER generate a signal.

5. Analyze the visible chart continuously and focus on ENTRY QUALITY using:
   - recent candle/price geometry
   - short-term momentum and acceleration
   - immediate price movement
   - pullbacks
   - rejection/reversal behavior
   - breakout and breakout continuation
   - recent local highs and lows
   - nearby support/resistance zones
   - exhaustion
   - continuation strength
   - volatility/noise
   - position of the current price inside the recent range

6. Evaluate direction AND expiry together. The engine must determine which specific combination has the strongest evidence:
   UP-1m, UP-2m, UP-3m, DOWN-1m, DOWN-2m, or DOWN-3m.
   Never choose direction first and randomly attach an expiry afterward.

7. Use an adaptive confidence threshold:
   - clean, strong setups may trigger quickly
   - ambiguous/noisy/conflicting setups must remain WAIT
   - do not lower the threshold simply to generate more signals
   - however, avoid excessive confirmation delay that causes a genuinely strong entry to be detected after the best entry point has already passed

8. WAIT must remain the default state.
   If there is no clear statistical/technical advantage for one of the six candidates, output WAIT.

9. Prevent missed opportunities by analyzing frequently and reacting quickly when a new valid setup develops. Do not require so many consecutive confirmations that the entry becomes late.

10. Add an internal diagnostic score for debugging:
    UP_SCORE
    DOWN_SCORE
    best expiry score for each direction
    winning candidate
    runner-up candidate
    score margin
    reasons/features contributing to the score

11. A signal must NOT automatically lock the system.

12. After displaying a signal, continue observing the Pocket Option screen:
    - If the user does NOT open a trade, do not lock.
    - If the setup expires/disappears before a trade is opened, return to WAIT and search for the next valid entry.
    - If an open trade is detected on the screen after the signal, lock the exact signal direction, confidence and expiry.

13. Use stable visible Pocket Option open-trade indicators for confirmation, including the active trade marker/amount/countdown and the active-trades UI/badge when available. Do not interpret ordinary candle movement as proof that a trade was opened.

14. Once an open trade is confirmed:
    LOCK the exact direction + expiry + confidence.
    Do not change UP/DOWN or 1m/2m/3m while that trade is active.

15. When the active trade ends:
    UNLOCK
    reset previous setup state
    return to WAIT
    start fresh analysis.

16. Preserve all currently working features:
    - overlay bubble
    - screen capture
    - confidence display
    - UP/DOWN display
    - expiry display
    - trade locking
    - Android permissions
    - existing stable UI

IMPORTANT:
Do not claim that confidence is a guaranteed win probability. Confidence represents the strength of evidence detected by the algorithm.

The goal is NOT maximum signal frequency. The goal is:
high-quality entry detection + fast reaction + symmetrical UP/DOWN analysis + correct expiry selection + WAIT during uncertainty + no directional bias.

Do not rebuild unrelated parts of the application. Modify the existing working project and preserve everything that is already stable.
