==================================================
DIRECTION VS ENTRY QUALITY
==================================================

Keep DIRECTION and ENTRY QUALITY conceptually separate.

A market may have a directional bias while still being a bad entry.

Examples:

late impulse,
exhaustion,
unstable reversal,
weak trace quality,
high disagreement,
insufficient margin,
or rapidly changing regime.

In those situations, WAIT may be better than publishing a direction.

==================================================
