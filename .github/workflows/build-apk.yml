name: Build DUAL BRAIN BALANCED

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Extract DUAL BRAIN BALANCED
        shell: bash
        run: |
          rm -rf "$GITHUB_WORKSPACE/dualbrain-balanced-build"
          mkdir -p "$GITHUB_WORKSPACE/dualbrain-balanced-build"
          unzip -q "$GITHUB_WORKSPACE/LiveSignalAssistant_DUAL_BRAIN_BALANCED.zip" -d "$GITHUB_WORKSPACE/dualbrain-balanced-build"

      - name: Find Android project
        shell: bash
        run: |
          SETTINGS=$(find "$GITHUB_WORKSPACE/dualbrain-balanced-build" -type f -name "settings.gradle" -print -quit)

          if [ -z "$SETTINGS" ]; then
            SETTINGS=$(find "$GITHUB_WORKSPACE/dualbrain-balanced-build" -type f -name "settings.gradle.kts" -print -quit)
          fi

          if [ -z "$SETTINGS" ]; then
            echo "ERROR: settings.gradle not found"
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS")
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "PROJECT_DIR=$PROJECT_DIR"

      - name: Build APK
        shell: bash
        run: |
          cd "$PROJECT_DIR"

          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
            ./gradlew assembleDebug --stacktrace
          else
            gradle assembleDebug --stacktrace
          fi

      - name: Collect APK
        shell: bash
        run: |
          APK=$(find "$GITHUB_WORKSPACE/dualbrain-balanced-build" -type f -name "*.apk" -print -quit)

          if [ -z "$APK" ]; then
            echo "ERROR: APK not found"
            exit 1
          fi

          mkdir -p "$GITHUB_WORKSPACE/apk-output"
          cp "$APK" "$GITHUB_WORKSPACE/apk-output/LiveSignalAssistant-DUAL-BRAIN-BALANCED.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: LiveSignalAssistant-DUAL-BRAIN-BALANCED
          path: apk-output/LiveSignalAssistant-DUAL-BRAIN-BALANCED.apk
          if-no-files-found: error
