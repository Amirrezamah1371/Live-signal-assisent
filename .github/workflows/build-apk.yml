name: Build 90S Experience Brain

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Extract source
        shell: bash
        run: |
          set -euo pipefail

          ZIP="$(find "$GITHUB_WORKSPACE" -maxdepth 1 -type f -name '*90S_EXPERIENCE_BRAIN*.zip' -print -quit)"

          if [ -z "$ZIP" ]; then
            echo "::error::90S EXPERIENCE BRAIN ZIP not found in repository root"
            exit 1
          fi

          DEST="$RUNNER_TEMP/experience-brain-90s"
          rm -rf "$DEST"
          mkdir -p "$DEST"

          unzip -q "$ZIP" -d "$DEST"

          SETTINGS="$(find "$DEST" -type f \( -name 'settings.gradle' -o -name 'settings.gradle.kts' \) -print -quit)"

          if [ -z "$SETTINGS" ]; then
            echo "::error::settings.gradle or settings.gradle.kts not found"
            exit 1
          fi

          PROJECT_DIR="$(dirname "$SETTINGS")"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Android project found at: $PROJECT_DIR"

      - name: Verify Experience Brain source
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          test -f "app/src/main/java/com/example/livesignalassistant/CaptureService.kt"
          test -f "app/src/main/java/com/example/livesignalassistant/SignalAnalyzer.kt"
          test -f "app/src/main/java/com/example/livesignalassistant/MemoryStore.kt"
          test -f "app/src/main/java/com/example/livesignalassistant/MemoryExporter.kt"
          test -f "app/src/main/java/com/example/livesignalassistant/ExperienceStore.kt"

          grep -q 'com.example.livesignalassistant.finalbrain90' app/build.gradle.kts
          grep -q 'permanent_experience/experience_v1.json' app/src/main/java/com/example/livesignalassistant/ExperienceStore.kt
          grep -q 'experience.learn' app/src/main/java/com/example/livesignalassistant/CaptureService.kt
          grep -q 'experience_snapshot/experience_v1.json' app/src/main/java/com/example/livesignalassistant/MemoryExporter.kt

          echo "Experience Brain source verified."

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Build APK
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
            ./gradlew --no-daemon clean assembleDebug --stacktrace
          else
            gradle --no-daemon clean assembleDebug --stacktrace
          fi

      - name: Collect APK
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p "$GITHUB_WORKSPACE/apk-output"

          APK="$(find "$PROJECT_DIR" -type f -name '*.apk' -path '*/build/outputs/apk/*' -print -quit)"

          if [ -z "$APK" ]; then
            echo "::error::Built APK not found"
            exit 1
          fi

          cp "$APK" "$GITHUB_WORKSPACE/apk-output/LiveSignalAssistant-71.7.27-90S-EXPERIENCE-BRAIN.apk"

          echo "APK collected successfully."

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: LiveSignalAssistant-71.7.27-90S-EXPERIENCE-BRAIN
          path: apk-output/LiveSignalAssistant-71.7.27-90S-EXPERIENCE-BRAIN.apk
          if-no-files-found: error
