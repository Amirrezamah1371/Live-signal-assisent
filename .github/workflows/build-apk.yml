==================================================
LEARNING SAFETY / ANTI-OVERFITTING


Do NOT modify trading rules simply because a few previous trades won.


Do NOT optimize specifically for historical WIN examples.


Do NOT memorize historical screenshots as trading rules.


Historical memory is evaluation data.


Future performance must be evaluated using new unseen DEMO sessions.


Keep every algorithmic modification:


conservative
explainable
measurable
reversible


==================================================
SIGNAL LOCK


Preserve the existing manual signal-lock workflow.


When UP/DOWN is generated, the user decides whether to execute it.


Do not automatically place the trade.


When the signal is locked/executed, start the appropriate expiry workflow according to the existing architecture.


At expiry provide:


WIN
LOSS
VOID


Record the result and timestamp.


