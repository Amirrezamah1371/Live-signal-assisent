Important requirements:
- Keep only 1-minute and 5-minute signal horizons.
- Do NOT restore 30-second or 4-minute signals.
- Keep V5.5 MATURE RESTORED untouched as the benchmark.
- DUAL BRAIN must remain a separately installable Android app.
- Never add automatic trade execution or automatic clicking.
- Do not use fixed signal quotas such as “maximum 3 signals per minute”.
- Signal frequency must be determined by genuine market setups, structural changes, and new evidence.
- Prevent signal spam using setup/wave identity and meaningful market-state changes, not arbitrary cooldowns.
- Allow fast UP↔DOWN reversal when strong new evidence genuinely supports it.
- Maintain independent engines for micro movement, candle/pattern structure, historical-pattern similarity, market structure, momentum/volatility, support/resistance, breakout/follow-through, exhaustion, reversal detection, and entry timing.
- Historical similarity must compare current candle/price structures with previous structures and use subsequent historical behavior as supporting evidence only when similarity is sufficiently strong.
- Historical evidence must never override strong new real-time evidence.
- The central Decision Brain must combine and challenge the independent engine outputs and separately determine direction (UP/DOWN/WAIT) and entry timing (NOW/NOT NOW) for 1m and 5m.
- Continue analysis while previous signals/trades are active.
- Do not display fake probabilities, fake confidence percentages, or claimed win rates.
- Optimize for low latency, precision, sensitivity to unexpected market movement, intelligent risk-taking, and avoidance of both excessive WAIT and reckless signals.
- Preserve logs needed to distinguish direction errors, timing errors, regime errors, and historical-pattern errors.
- Test changes on Demo only before considering them validated.
- Do not claim any improvement in win rate unless new out-of-sample Demo results actually demonstrate it.

First inspect the actual source code carefully. Do not guess what is inside the ZIP. Identify the current architecture and existing implementation before making any changes. Then continue development from the real code and verify every modification before producing a new build/source package.
