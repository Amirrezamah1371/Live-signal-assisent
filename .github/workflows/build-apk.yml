name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "LiveSignalAssistant_latest_fixed.zip"
      - ".github/workflows/build-apk.yml"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify project exists
        run: |
          test -f LiveSignalAssistant_latest_fixed.zip
          echo "Building LiveSignalAssistant_latest_fixed.zip"

      - name: Extract latest project
        run: |
          rm -rf project
          mkdir project
          unzip -q LiveSignalAssistant_latest_fixed.zip -d project
          test -f project/settings.gradle
          test -f project/app/build.gradle

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Force Java and Kotlin JVM 17
        working-directory: project
        run: |
          cat >> app/build.gradle <<'EOF'

          android {
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }

          tasks.withType(org.jetbrains.kotlin.gradle.tasks.KotlinCompile).configureEach {
              kotlinOptions {
                  jvmTarget = "17"
              }
          }
          EOF

      - name: Build APK
        working-directory: project
        run: gradle --no-daemon clean assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: LiveSignalAssistant-APK
          path: project/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
