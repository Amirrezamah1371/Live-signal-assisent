name: Build 27.7.71

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'LiveSignalAssistant_27.7.71.zip'
      - '.github/workflows/build-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Check Android SDK
        shell: bash
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"

          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"

          if [ ! -f "$SDKMANAGER" ]; then
            SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -type f -name "sdkmanager" | head -n 1)
          fi

          if [ -z "$SDKMANAGER" ]; then
            echo "ERROR: sdkmanager not found"
            exit 1
          fi

          yes | "$SDKMANAGER" --licenses >/dev/null || true

          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Find 27.7.71 ZIP
        id: zip
        shell: bash
        run: |
          ZIP_FILE=$(find "$GITHUB_WORKSPACE" -type f -name "LiveSignalAssistant_27.7.71.zip" | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: LiveSignalAssistant_27.7.71.zip not found"
            exit 1
          fi

          echo "Found: $ZIP_FILE"
          echo "zip=$ZIP_FILE" >> "$GITHUB_OUTPUT"

      - name: Verify ZIP
        shell: bash
        run: |
          unzip -t "${{ steps.zip.outputs.zip }}"

      - name: Extract source
        shell: bash
        run: |
          rm -rf "$RUNNER_TEMP/lsa-27771"
          mkdir -p "$RUNNER_TEMP/lsa-27771"

          unzip -q "${{ steps.zip.outputs.zip }}" \
            -d "$RUNNER_TEMP/lsa-27771"

      - name: Locate Android project
        id: project
        shell: bash
        run: |
          SETTINGS=$(find "$RUNNER_TEMP/lsa-27771" -type f -name "settings.gradle" | head -n 1)

          if [ -z "$SETTINGS" ]; then
            SETTINGS=$(find "$RUNNER_TEMP/lsa-27771" -type f -name "settings.gradle.kts" | head -n 1)
          fi

          if [ -z "$SETTINGS" ]; then
            echo "ERROR: Android project not found"
            find "$RUNNER_TEMP/lsa-27771" -maxdepth 5 -type f | sort
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS")

          echo "Project: $PROJECT_DIR"
          echo "dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"

      - name: Verify version
        shell: bash
        working-directory: ${{ steps.project.outputs.dir }}
        run: |
          echo "===== APPLICATION ID ====="
          grep -R "applicationId" app/build.gradle app/build.gradle.kts 2>/dev/null || true

          echo "===== VERSION ====="
          grep -R "versionName" app/build.gradle app/build.gradle.kts 2>/dev/null || true

          echo "===== SOURCE FILES ====="
          find app/src/main -type f | sort

      - name: Build APK
        shell: bash
        working-directory: ${{ steps.project.outputs.dir }}
        run: |
          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
            ./gradlew clean assembleDebug --stacktrace
          else
            gradle clean assembleDebug --stacktrace
          fi

      - name: Collect APK
        shell: bash
        working-directory: ${{ steps.project.outputs.dir }}
        run: |
          APK=$(find . -type f -path "*/build/outputs/apk/debug/*.apk" | head -n 1)

          if [ -z "$APK" ]; then
            echo "ERROR: APK was not generated"
            find . -type f -name "*.apk"
            exit 1
          fi

          mkdir -p "$GITHUB_WORKSPACE/output"

          cp "$APK" \
            "$GITHUB_WORKSPACE/output/LiveSignalAssistant-27.7.71.apk"

          echo "===== APK READY ====="
          ls -lh "$GITHUB_WORKSPACE/output/LiveSignalAssistant-27.7.71.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: LiveSignalAssistant-27.7.71
          path: output/LiveSignalAssistant-27.7.71.apk
          if-no-files-found: error
          retention-days: 30
