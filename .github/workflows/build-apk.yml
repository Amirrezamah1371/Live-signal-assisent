name: Build V2 APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Extract project
        shell: bash
        run: |
          set -e
          ZIP=$(find . -name "LiveSignalAssistant_71.7.27_90S_VISION_2M3M_EXPERIENCE_V2.zip" | head -1)
          test -n "$ZIP"
          mkdir -p /tmp/project
          unzip -q "$ZIP" -d /tmp/project
          SETTINGS=$(find /tmp/project -name "settings.gradle*" | head -1)
          test -n "$SETTINGS"
          PROJECT=$(dirname "$SETTINGS")
          echo "PROJECT=$PROJECT" >> "$GITHUB_ENV"
          echo "Project: $PROJECT"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Build APK
        shell: bash
        run: |
          cd "$PROJECT"
          if [ -f gradlew ]; then
            chmod +x gradlew
            ./gradlew --no-daemon assembleDebug --stacktrace
          else
            gradle --no-daemon assembleDebug --stacktrace
          fi

      - name: Collect APK
        shell: bash
        run: |
          APK=$(find "$PROJECT" -name "*.apk" | head -1)
          test -n "$APK"
          mkdir -p /tmp/apk
          cp "$APK" /tmp/apk/LiveSignalAssistant-V2-debug.apk
          ls -lh /tmp/apk/LiveSignalAssistant-V2-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: LiveSignalAssistant-V2
          path: /tmp/apk/LiveSignalAssistant-V2-debug.apk
