name: Build 5M Specialist APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Find and extract source ZIP
        shell: bash
        run: |
          set -euo pipefail

          ZIP=$(find "$GITHUB_WORKSPACE" -type f \
            -name "LiveSignalAssistant_71.7.27_5M_SPECIALIST.zip" \
            | head -n 1)

          if [ -z "$ZIP" ]; then
            echo "ERROR: 5M Specialist source ZIP not found."
            exit 1
          fi

          echo "SOURCE ZIP: $ZIP"

          mkdir -p "$RUNNER_TEMP/livesignal"
          unzip -q "$ZIP" -d "$RUNNER_TEMP/livesignal"

          SETTINGS=$(find "$RUNNER_TEMP/livesignal" -type f \
            \( -name "settings.gradle" -o -name "settings.gradle.kts" \) \
            | head -n 1)

          if [ -z "$SETTINGS" ]; then
            echo "ERROR: settings.gradle/settings.gradle.kts not found."
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS")

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "ANDROID PROJECT: $PROJECT_DIR"

      - name: Show project information
        shell: bash
        run: |
          set -euo pipefail

          echo "Project directory:"
          echo "$PROJECT_DIR"

          echo "Gradle files:"
          find "$PROJECT_DIR" -maxdepth 3 -type f \
            \( -name "*.gradle" -o -name "*.gradle.kts" \) \
            -print

      - name: Set up Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Build debug APK
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
            ./gradlew --no-daemon clean assembleDebug --stacktrace
          else
            gradle --no-daemon clean assembleDebug --stacktrace
          fi

      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail

          APK=$(find "$PROJECT_DIR" -type f -path "*/build/outputs/apk/debug/*.apk" \
            | head -n 1)

          if [ -z "$APK" ]; then
            echo "ERROR: Build finished but APK was not found."
            exit 1
          fi

          echo "APK FOUND:"
          ls -lh "$APK"

          mkdir -p "$RUNNER_TEMP/final-apk"
          cp "$APK" "$RUNNER_TEMP/final-apk/LiveSignalAssistant-5M-Specialist-debug.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: LiveSignalAssistant-5M-Specialist
          path: ${{ runner.temp }}/final-apk/LiveSignalAssistant-5M-Specialist-debug.apk
          if-no-files-found: error
          retention-days: 7
