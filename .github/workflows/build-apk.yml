name: Build Trader Robot

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Prepare Android SDK
        shell: bash
        run: |
          set -euo pipefail

          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"

          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER=$(find "$ANDROID_HOME" -type f -name sdkmanager | head -n 1)
          fi

          if [ -z "${SDKMANAGER:-}" ] || [ ! -x "$SDKMANAGER" ]; then
            echo "sdkmanager not found"
            exit 1
          fi

          yes | "$SDKMANAGER" --licenses >/dev/null || true

          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Find source ZIP
        id: source
        shell: bash
        run: |
          set -euo pipefail

          ZIP_FILE=$(find "$GITHUB_WORKSPACE" -type f -name "Trader_Robot_71.7.27_DATA_DRIVEN.zip" | head -n 1)

          if [ -z "${ZIP_FILE:-}" ]; then
            echo "Trader_Robot_71.7.27_DATA_DRIVEN.zip not found"
            exit 1
          fi

          echo "zip=$ZIP_FILE" >> "$GITHUB_OUTPUT"
          echo "Using: $ZIP_FILE"

      - name: Verify ZIP
        shell: bash
        run: |
          set -euo pipefail
          unzip -t "${{ steps.source.outputs.zip }}"

      - name: Extract project
        shell: bash
        run: |
          set -euo pipefail

          PROJECT_DIR="$RUNNER_TEMP/trader-robot"
          rm -rf "$PROJECT_DIR"
          mkdir -p "$PROJECT_DIR"

          unzip -q "${{ steps.source.outputs.zip }}" -d "$PROJECT_DIR"

      - name: Locate Android project
        id: project
        shell: bash
        run: |
          set -euo pipefail

          PROJECT_DIR="$RUNNER_TEMP/trader-robot"

          SETTINGS=$(find "$PROJECT_DIR" -type f -name "settings.gradle" | head -n 1)

          if [ -z "${SETTINGS:-}" ]; then
            SETTINGS=$(find "$PROJECT_DIR" -type f -name "settings.gradle.kts" | head -n 1)
          fi

          if [ -z "${SETTINGS:-}" ]; then
            echo "Gradle settings file not found"
            exit 1
          fi

          ROOT_DIR=$(dirname "$SETTINGS")

          echo "root=$ROOT_DIR" >> "$GITHUB_OUTPUT"
          echo "Project root: $ROOT_DIR"

      - name: Build APK
        shell: bash
        working-directory: ${{ steps.project.outputs.root }}
        run: |
          set -euo pipefail

          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
            ./gradlew clean assembleDebug --stacktrace
          else
            gradle clean assembleDebug --stacktrace
          fi

      - name: Collect APK
        shell: bash
        run: |
          set -euo pipefail

          ROOT_DIR="${{ steps.project.outputs.root }}"
          OUTPUT_DIR="$GITHUB_WORKSPACE/apk-output"

          rm -rf "$OUTPUT_DIR"
          mkdir -p "$OUTPUT_DIR"

          APK=$(find "$ROOT_DIR" -type f -name "*debug*.apk" | head -n 1)

          if [ -z "${APK:-}" ]; then
            echo "Debug APK not found"
            exit 1
          fi

          cp "$APK" "$OUTPUT_DIR/Trader-Robot-71.7.27.apk"

          ls -lh "$OUTPUT_DIR/Trader-Robot-71.7.27.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Trader-Robot-71.7.27
          path: apk-output/Trader-Robot-71.7.27.apk
          if-no-files-found: error
          retention-days: 30
