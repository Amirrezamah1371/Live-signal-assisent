name: Build LSA Review Extractor

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'Extractor.zip'
      - '.github/workflows/build-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Check Android SDK
        shell: bash
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          ls -la "$ANDROID_HOME"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Find Extractor ZIP
        id: zip
        shell: bash
        run: |
          ZIP_FILE=$(find "$GITHUB_WORKSPACE" -type f -name "Extractor.zip" | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: Extractor.zip not found"
            exit 1
          fi

          echo "Found: $ZIP_FILE"
          echo "zip=$ZIP_FILE" >> "$GITHUB_OUTPUT"

      - name: Verify ZIP
        shell: bash
        run: |
          unzip -t "${{ steps.zip.outputs.zip }}"

      - name: Extract source
        shell: bash
        run: |
          rm -rf "$RUNNER_TEMP/lsa-extractor"
          mkdir -p "$RUNNER_TEMP/lsa-extractor"
          unzip -q "${{ steps.zip.outputs.zip }}" -d "$RUNNER_TEMP/lsa-extractor"

      - name: Locate Android project
        id: project
        shell: bash
        run: |
          SETTINGS=$(find "$RUNNER_TEMP/lsa-extractor" -type f -name "settings.gradle" | head -n 1)

          if [ -z "$SETTINGS" ]; then
            SETTINGS=$(find "$RUNNER_TEMP/lsa-extractor" -type f -name "settings.gradle.kts" | head -n 1)
          fi

          if [ -z "$SETTINGS" ]; then
            echo "ERROR: Android project not found"
            find "$RUNNER_TEMP/lsa-extractor" -maxdepth 5 -type f | sort
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS")
          echo "Project: $PROJECT_DIR"
          echo "dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"

      - name: Inspect project
        shell: bash
        working-directory: ${{ steps.project.outputs.dir }}
        run: |
          echo "===== PROJECT ====="
          find . -maxdepth 4 -type f | sort

          echo "===== APPLICATION ID ====="
          grep -R "applicationId" app/build.gradle app/build.gradle.kts 2>/dev/null || true

      - name: Build Debug APK
        shell: bash
        working-directory: ${{ steps.project.outputs.dir }}
        run: |
          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
            ./gradlew clean assembleDebug --stacktrace
          else
            gradle clean assembleDebug --stacktrace
          fi

      - name: Collect APK
        shell: bash
        working-directory: ${{ steps.project.outputs.dir }}
        run: |
          APK=$(find . -type f -path "*/build/outputs/apk/debug/*.apk" | head -n 1)

          if [ -z "$APK" ]; then
            echo "ERROR: APK not generated"
            find . -type f -name "*.apk"
            exit 1
          fi

          mkdir -p "$GITHUB_WORKSPACE/output"
          cp "$APK" "$GITHUB_WORKSPACE/output/LSA-Review-Extractor.apk"

          echo "===== APK READY ====="
          ls -lh "$GITHUB_WORKSPACE/output/LSA-Review-Extractor.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: LSA-Review-Extractor
          path: output/LSA-Review-Extractor.apk
          if-no-files-found: error
          retention-days: 30
