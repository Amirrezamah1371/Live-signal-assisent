name: Build Live Signal Assistant R3

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Find R3 source ZIP
        id: source
        shell: bash
        run: |
          set -e

          ZIP_NAME="LiveSignalAssistant_71.7.27_90S_EXPERIENCE_V2_SEPARATE_R3.zip"

          echo "Searching for:"
          echo "$ZIP_NAME"

          ZIP_PATH="$(find . -type f -name "$ZIP_NAME" | head -1)"

          if [ -z "$ZIP_PATH" ]; then
            echo "ERROR: R3 source ZIP was not found."
            echo ""
            echo "Available ZIP files:"
            find . -type f -iname "*.zip" -print
            exit 1
          fi

          echo "FOUND:"
          echo "$ZIP_PATH"

          echo "zip_path=$ZIP_PATH" >> "$GITHUB_OUTPUT"

      - name: Extract R3 source
        shell: bash
        run: |
          set -e

          rm -rf extracted_source
          mkdir -p extracted_source

          unzip -q "${{ steps.source.outputs.zip_path }}" \
            -d extracted_source

          echo "R3 source extracted successfully."

      - name: Locate Android project
        id: project
        shell: bash
        run: |
          set -e

          SETTINGS_FILE="$(find extracted_source -type f \( \
            -name "settings.gradle" -o \
            -name "settings.gradle.kts" \
          \) | head -1)"

          if [ -z "$SETTINGS_FILE" ]; then
            echo "ERROR: Android project not found inside R3 ZIP."
            echo ""
            echo "Extracted files:"
            find extracted_source -type f | sort
            exit 1
          fi

          PROJECT_DIR="$(dirname "$SETTINGS_FILE")"

          echo "Android project located at:"
          echo "$PROJECT_DIR"

          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"

      - name: Verify R3 package configuration
        shell: bash
        working-directory: ${{ steps.project.outputs.project_dir }}
        run: |
          set -e

          echo "=== PROJECT ==="
          pwd
          ls -la

          if [ ! -f "settings.gradle" ] && [ ! -f "settings.gradle.kts" ]; then
            echo "ERROR: settings.gradle missing."
            exit 1
          fi

          if [ ! -f "build.gradle" ] && [ ! -f "build.gradle.kts" ]; then
            echo "ERROR: root build.gradle missing."
            exit 1
          fi

          echo ""
          echo "=== CHECKING R3 APPLICATION ID ==="

          if grep -R \
            "com.example.livesignalassistant.recency71727expv2r3" \
            app/build.gradle* >/dev/null 2>&1; then

            echo "R3 independent applicationId confirmed."

          else
            echo "ERROR: Independent R3 applicationId was not found."
            echo "Refusing to build an APK that may overwrite the old app."
            exit 1
          fi

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Prepare Gradle
        shell: bash
        working-directory: ${{ steps.project.outputs.project_dir }}
        run: |
          set -e

          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
            echo "Using project Gradle Wrapper."
            ./gradlew --version
          else
            echo "Gradle Wrapper not found."
            echo "Using system Gradle."
            gradle --version
          fi

      - name: Build R3 Debug APK
        shell: bash
        working-directory: ${{ steps.project.outputs.project_dir }}
        run: |
          set -o pipefail

          echo "========================================"
          echo "BUILDING R3"
          echo "========================================"

          if [ -f "./gradlew" ]; then
            ./gradlew \
              --no-daemon \
              clean \
              assembleDebug \
              --stacktrace \
              2>&1 | tee build-r3.log
          else
            gradle \
              --no-daemon \
              clean \
              assembleDebug \
              --stacktrace \
              2>&1 | tee build-r3.log
          fi

      - name: Show real compiler errors
        if: failure()
        shell: bash
        working-directory: ${{ steps.project.outputs.project_dir }}
        run: |
          echo "========================================"
          echo "REAL BUILD / COMPILER ERRORS"
          echo "========================================"

          if [ -f "build-r3.log" ]; then

            grep -n -E \
              "(^e:|error:|Syntax error|Unresolved reference|Type mismatch|Compilation error|Execution failed for task|What went wrong|FAILURE:|Manifest merger failed|Android resource linking failed)" \
              build-r3.log \
              | head -200 || true

            echo ""
            echo "========================================"
            echo "LAST 200 BUILD LOG LINES"
            echo "========================================"

            tail -200 build-r3.log

          else
            echo "build-r3.log was not created."
          fi

      - name: Find R3 APK
        id: apk
        if: success()
        shell: bash
        run: |
          set -e

          APK_PATH="$(find extracted_source \
            -type f \
            -path "*/build/outputs/apk/*" \
            -name "*.apk" \
            | head -1)"

          if [ -z "$APK_PATH" ]; then
            echo "ERROR: Build succeeded but APK was not found."
            exit 1
          fi

          echo "APK FOUND:"
          echo "$APK_PATH"

          mkdir -p final_apk

          cp "$APK_PATH" \
            "final_apk/TraderRobot_71.7.27_90S_Experience_V2_R3.apk"

          echo ""
          echo "=== FINAL R3 APK ==="
          ls -lh final_apk/

      - name: Upload R3 APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: TraderRobot-71.7.27-90S-Experience-V2-R3
          path: final_apk/TraderRobot_71.7.27_90S_Experience_V2_R3.apk
          if-no-files-found: error
          retention-days: 30
