90-SECOND DECISION CYCLE




The intended cycle is:


80 seconds = observation and analysis
10 seconds = final validation
Total = approximately 90 seconds


During the first 80 seconds:


Continuously collect market observations.


Do NOT issue a new trade signal.


Track accumulated directional evidence, momentum, structure, velocity, acceleration, exhaustion, impulse maturity, counter-movement and shock/regime information.


During the final 10 seconds:


Do NOT throw away the previous 80 seconds.


Use the final window primarily to validate the proposed entry.


The final window may:


CONFIRM
WEAKEN
VETO


the candidate.


It must NOT reverse UP to DOWN or DOWN to UP because of a normal short pullback.


Direction reversal is permitted only when multiple independent pieces of evidence confirm a genuine regime change, such as:


strong counter impulse
persistent opposite movement
meaningful velocity reversal
acceleration reversal
structure failure/break
failure of the previous continuation
significant volatility/shock evidence


One opposite candle is NOT sufficient.


A short retracement is NOT sufficient.




ONE DECISION PER CYCLE




At the end of each complete cycle produce only:


UP
DOWN
WAIT


Do not produce multiple competing trade signals during one cycle.


WAIT is valid.


Do not force a trade.




DIRECTION AND ENTRY QUALITY MUST REMAIN SEPARATE




A correct trend direction does NOT automatically mean the current moment is a good entry.


Example:


Direction = UP
Trend = strong
Impulse = mature
Entry timing = late


Correct behavior:


WAIT


NOT DOWN.


The assistant must independently evaluate:


direction quality
entry quality
impulse maturity
late-entry risk
exhaustion
remaining movement potential




LATE ENTRY PROTECTION




Preserve the late-entry/exhaustion protections already present in the source.


Avoid entries after the majority of the short-term move has already happened.


Detect situations including:


