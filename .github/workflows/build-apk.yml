PROJECT NAME:
Live Signal Assistant 71.7.27


VERSION:
71.7.27


This source is based on our previously working Live Signal Assistant architecture and must remain the foundation of the new build.


DO NOT rebuild the trading-analysis engine from scratch.
DO NOT replace working logic with simplified, random, placeholder, or experimental logic.
DO NOT remove working features merely to make the project compile.


PRIMARY OBJECTIVE:
Improve signal quality and entry timing while preserving the proven architecture.


Accuracy is more important than signal frequency.


WAIT is the default whenever the evidence is not strong enough.


==================================================
CORE DECISION SYSTEM


Maintain ONE DECISION per analysis cycle.


Each cycle should observe and analyze the chart for approximately 60 seconds.


During the cycle continuously collect observations, but DO NOT issue multiple signals.


At the end of the cycle output exactly ONE:


UP
DOWN
WAIT


Then start a new cycle.


Never force UP or DOWN merely because the cycle has ended.


WAIT is a correct and desirable result when evidence is insufficient.


