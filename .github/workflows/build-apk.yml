name: Build V5.5 TIMEFRAME BRAIN FIXED 5.7.2

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Verify source ZIP
        shell: bash
        run: |
          set -e

          ZIP_FILE="$GITHUB_WORKSPACE/LiveSignalAssistant_V5_5_TIMEFRAME_BRAIN_FIXED_572.zip"

          echo "Looking for:"
          echo "$ZIP_FILE"

          if [ ! -f "$ZIP_FILE" ]; then
            echo "ERROR: Source ZIP was not found."
            echo "Repository root contents:"
            ls -la "$GITHUB_WORKSPACE"
            exit 1
          fi

          echo "Source ZIP found."
          unzip -t "$ZIP_FILE"

      - name: Extract project
        shell: bash
        run: |
          set -e

          ZIP_FILE="$GITHUB_WORKSPACE/LiveSignalAssistant_V5_5_TIMEFRAME_BRAIN_FIXED_572.zip"
          BUILD_DIR="$GITHUB_WORKSPACE/timeframe-brain-build"

          rm -rf "$BUILD_DIR"
          mkdir -p "$BUILD_DIR"

          unzip -q "$ZIP_FILE" -d "$BUILD_DIR"

          echo "ZIP extracted successfully."

      - name: Locate Android project
        id: project
        shell: bash
        run: |
          set -e

          BUILD_DIR="$GITHUB_WORKSPACE/timeframe-brain-build"

          SETTINGS_FILE=$(find "$BUILD_DIR" -type f -name "settings.gradle" | head -1)

          if [ -z "$SETTINGS_FILE" ]; then
            SETTINGS_FILE=$(find "$BUILD_DIR" -type f -name "settings.gradle.kts" | head -1)
          fi

          if [ -z "$SETTINGS_FILE" ]; then
            echo "ERROR: settings.gradle/settings.gradle.kts not found."
            find "$BUILD_DIR" -maxdepth 5 -type f | sort
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS_FILE")

          echo "Android project:"
          echo "$PROJECT_DIR"

          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"

          if [ ! -d "$PROJECT_DIR/app" ]; then
            echo "ERROR: app module not found."
            exit 1
          fi

      - name: Verify critical source files
        shell: bash
        run: |
          set -e

          PROJECT_DIR="${{ steps.project.outputs.project_dir }}"

          SIGNAL_ANALYZER=$(find "$PROJECT_DIR/app/src" -type f -name "SignalAnalyzer.kt" | head -1)
          CAPTURE_SERVICE=$(find "$PROJECT_DIR/app/src" -type f -name "CaptureService.kt" | head -1)

          if [ -z "$SIGNAL_ANALYZER" ]; then
            echo "ERROR: SignalAnalyzer.kt not found."
            exit 1
          fi

          if [ -z "$CAPTURE_SERVICE" ]; then
            echo "ERROR: CaptureService.kt not found."
            exit 1
          fi

          echo "SignalAnalyzer:"
          echo "$SIGNAL_ANALYZER"

          echo "CaptureService:"
          echo "$CAPTURE_SERVICE"

          echo "Checking 5.7.2 fix..."

          if ! grep -q "val horizonContext=" "$SIGNAL_ANALYZER"; then
            echo "ERROR: horizonContext is missing."
            exit 1
          fi

          if ! grep -q "val horizonBonus=" "$SIGNAL_ANALYZER"; then
            echo "ERROR: horizonBonus is missing."
            exit 1
          fi

          echo "Source verification passed."

      - name: Show Gradle information
        shell: bash
        run: |
          set -e

          PROJECT_DIR="${{ steps.project.outputs.project_dir }}"
          cd "$PROJECT_DIR"

          echo "Project directory:"
          pwd

          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
            ./gradlew --version
          else
            echo "Gradle wrapper not found. Using installed Gradle."
            gradle --version
          fi

      - name: Clean old build outputs
        shell: bash
        run: |
          set -e

          PROJECT_DIR="${{ steps.project.outputs.project_dir }}"

          rm -rf "$PROJECT_DIR/app/build"
          rm -rf "$PROJECT_DIR/build"
          rm -rf "$GITHUB_WORKSPACE/apk-output"

          mkdir -p "$GITHUB_WORKSPACE/apk-output"

      - name: Build debug APK
        shell: bash
        run: |
          set -e

          PROJECT_DIR="${{ steps.project.outputs.project_dir }}"
          cd "$PROJECT_DIR"

          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
            ./gradlew clean assembleDebug --stacktrace --no-daemon
          else
            gradle clean assembleDebug --stacktrace --no-daemon
          fi

      - name: Locate generated APK
        id: apk
        shell: bash
        run: |
          set -e

          PROJECT_DIR="${{ steps.project.outputs.project_dir }}"

          APK_FILE=$(find "$PROJECT_DIR/app/build/outputs/apk" -type f -name "*.apk" | head -1)

          if [ -z "$APK_FILE" ]; then
            echo "ERROR: APK was not generated."
            find "$PROJECT_DIR" -type f -name "*.apk" || true
            exit 1
          fi

          OUTPUT_APK="$GITHUB_WORKSPACE/apk-output/LiveSignalAssistant-TIMEFRAME-BRAIN-5.7.2.apk"

          cp "$APK_FILE" "$OUTPUT_APK"

          echo "APK generated successfully:"
          ls -lh "$OUTPUT_APK"

          echo "apk_file=$OUTPUT_APK" >> "$GITHUB_OUTPUT"

      - name: Generate SHA256
        shell: bash
        run: |
          set -e

          cd "$GITHUB_WORKSPACE/apk-output"

          sha256sum "LiveSignalAssistant-TIMEFRAME-BRAIN-5.7.2.apk" > "LiveSignalAssistant-TIMEFRAME-BRAIN-5.7.2.sha256"

          cat "LiveSignalAssistant-TIMEFRAME-BRAIN-5.7.2.sha256"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: LiveSignalAssistant-TIMEFRAME-BRAIN-5.7.2
          path: |
            apk-output/LiveSignalAssistant-TIMEFRAME-BRAIN-5.7.2.apk
            apk-output/LiveSignalAssistant-TIMEFRAME-BRAIN-5.7.2.sha256
          if-no-files-found: error
          retention-days: 30
