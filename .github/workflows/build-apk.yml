name: Build Live Signal Assistant

"on":
  push:
    branches:
      - main
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Unpack source ZIP
        run: |
          mkdir -p build_src
          unzip -q LiveSignalAssistant_72_0_0_TRACEFIX_EXPERIENCE_V3.zip -d build_src

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Build APK
        working-directory: build_src
        run: gradle --no-daemon clean assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: LiveSignalAssistant-72.0.0
          path: build_src/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
