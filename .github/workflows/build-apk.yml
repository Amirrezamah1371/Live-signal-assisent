==================================================
CORE ARCHITECTURE — MUST BE PRESERVED
==================================================

This is a 90-second analysis architecture.

PHASE 1:
0–80 seconds = deep observation.

The bot observes and analyzes continuously but MUST NOT publish a trade signal during this phase.

PHASE 2:
80–90 seconds = FINAL VERIFY / FINAL BRAIN.

The final 10 seconds must give increased importance to recent persistent evidence and genuine change-points.

A single spike, noisy frame, or isolated counter-move must NOT flip the direction.

At the end of the 90-second cycle, EXACTLY ONE final output is allowed:

UP 2M
DOWN 2M
UP 3M
DOWN 3M
WAIT

No multiple signals per cycle.

WAIT is a valid and important decision.

If evidence quality is insufficient, contradictory, stale, visually unreliable, or ambiguous, choose WAIT instead of forcing a signal.

==================================================
2M AND 3M HORIZONS
==================================================

2-minute and 3-minute predictions MUST remain independent horizons.

Do NOT implement them as the same direction with two different timers.

The analysis must separately evaluate:

direction at Entry + 120 seconds

and

direction at Entry + 180 seconds.

The final brain may select the stronger horizon based on current evidence and learned historical evidence.

After the user manually LOCKS/STARTS a signal:

2M signal:
expiry = exactly 120 seconds from LOCK.

3M signal:
expiry = exactly 180 seconds from LOCK.

Use a monotonic clock for all timing-critical logic.

Do NOT start expiry from signal publication time.

