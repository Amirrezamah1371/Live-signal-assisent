name: Build DUAL BRAIN ACCURACY

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Extract ACCURACY
        shell: bash
        run: |
          rm -rf "$GITHUB_WORKSPACE/accuracy-build"
          mkdir -p "$GITHUB_WORKSPACE/accuracy-build"

          ZIP="$GITHUB_WORKSPACE/LiveSignalAssistant_DUAL_BRAIN_ACCURACY.zip"

          if [ ! -f "$ZIP" ]; then
            echo "ERROR: ZIP NOT FOUND"
            exit 1
          fi

          unzip -q "$ZIP" -d "$GITHUB_WORKSPACE/accuracy-build"

      - name: Find Android project
        shell: bash
        run: |
          SETTINGS=$(find "$GITHUB_WORKSPACE/accuracy-build" -type f -name "settings.gradle" -print -quit)

          if [ -z "$SETTINGS" ]; then
            SETTINGS=$(find "$GITHUB_WORKSPACE/accuracy-build" -type f -name "settings.gradle.kts" -print -quit)
          fi

          if [ -z "$SETTINGS" ]; then
            echo "ERROR: Android project not found"
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS")
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Android project: $PROJECT_DIR"

      - name: Build ACCURACY APK
        shell: bash
        run: |
          cd "$PROJECT_DIR"

          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
            ./gradlew assembleDebug --stacktrace
          else
            gradle assembleDebug --stacktrace
          fi

      - name: Collect APK
        shell: bash
        run: |
          APK=$(find "$GITHUB_WORKSPACE/accuracy-build" -type f -name "*.apk" -print -quit)

          if [ -z "$APK" ]; then
            echo "ERROR: APK not found"
            exit 1
          fi

          mkdir -p "$GITHUB_WORKSPACE/apk-output"
          cp "$APK" "$GITHUB_WORKSPACE/apk-output/LiveSignalAssistant-DUAL-BRAIN-ACCURACY.apk"

          echo "APK CREATED:"
          ls -lh "$GITHUB_WORKSPACE/apk-output/LiveSignalAssistant-DUAL-BRAIN-ACCURACY.apk"

      - name: Upload ACCURACY APK
        uses: actions/upload-artifact@v4
        with:
          name: LiveSignalAssistant-DUAL-BRAIN-ACCURACY
          path: apk-output/LiveSignalAssistant-DUAL-BRAIN-ACCURACY.apk
          if-no-files-found: error
