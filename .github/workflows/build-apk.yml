name: Build 5M MULTI-SCALE 5.9.0

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Verify source ZIP
        shell: bash
        run: |
          set -e

          ZIP_FILE="$GITHUB_WORKSPACE/LiveSignalAssistant_5M_MULTISCALE_590.zip"

          echo "========================================"
          echo "VERIFYING SOURCE ZIP"
          echo "========================================"

          if [ ! -f "$ZIP_FILE" ]; then
            echo "ERROR: LiveSignalAssistant_5M_MULTISCALE_590.zip not found."
            echo ""
            echo "Repository files:"
            ls -la "$GITHUB_WORKSPACE"
            exit 1
          fi

          echo "Source ZIP found:"
          echo "$ZIP_FILE"

          unzip -t "$ZIP_FILE"

          echo "ZIP integrity OK."

      - name: Extract project
        shell: bash
        run: |
          set -e

          ZIP_FILE="$GITHUB_WORKSPACE/LiveSignalAssistant_5M_MULTISCALE_590.zip"
          BUILD_DIR="$GITHUB_WORKSPACE/multiscale-590-build"

          rm -rf "$BUILD_DIR"
          mkdir -p "$BUILD_DIR"

          unzip -q "$ZIP_FILE" -d "$BUILD_DIR"

          echo "Project extracted successfully."

      - name: Locate Android project
        id: project
        shell: bash
        run: |
          set -e

          BUILD_DIR="$GITHUB_WORKSPACE/multiscale-590-build"

          SETTINGS_FILE=$(find "$BUILD_DIR" -type f -name "settings.gradle" | head -1)

          if [ -z "$SETTINGS_FILE" ]; then
            SETTINGS_FILE=$(find "$BUILD_DIR" -type f -name "settings.gradle.kts" | head -1)
          fi

          if [ -z "$SETTINGS_FILE" ]; then
            echo "ERROR: settings.gradle or settings.gradle.kts not found."
            echo ""
            find "$BUILD_DIR" -maxdepth 6 -type f | sort
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS_FILE")

          echo "Android project found:"
          echo "$PROJECT_DIR"

          if [ ! -d "$PROJECT_DIR/app" ]; then
            echo "ERROR: app module not found."
            exit 1
          fi

          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"

      - name: Verify critical source files
        shell: bash
        run: |
          set -e

          PROJECT_DIR="${{ steps.project.outputs.project_dir }}"

          SIGNAL_ANALYZER=$(find "$PROJECT_DIR/app/src" -type f -name "SignalAnalyzer.kt" | head -1)
          CAPTURE_SERVICE=$(find "$PROJECT_DIR/app/src" -type f -name "CaptureService.kt" | head -1)

          if [ -z "$SIGNAL_ANALYZER" ]; then
            echo "ERROR: SignalAnalyzer.kt not found."
            exit 1
          fi

          if [ -z "$CAPTURE_SERVICE" ]; then
            echo "ERROR: CaptureService.kt not found."
            exit 1
          fi

          echo "SignalAnalyzer found:"
          echo "$SIGNAL_ANALYZER"

          echo ""
          echo "CaptureService found:"
          echo "$CAPTURE_SERVICE"

          echo ""
          echo "Critical source files OK."

      - name: Verify version
        shell: bash
        run: |
          set -e

          PROJECT_DIR="${{ steps.project.outputs.project_dir }}"

          BUILD_FILE="$PROJECT_DIR/app/build.gradle.kts"

          if [ ! -f "$BUILD_FILE" ]; then
            BUILD_FILE="$PROJECT_DIR/app/build.gradle"
          fi

          if [ ! -f "$BUILD_FILE" ]; then
            echo "ERROR: app Gradle build file not found."
            exit 1
          fi

          echo "App build file:"
          echo "$BUILD_FILE"

          echo ""
          echo "Application information:"
          grep -n "applicationId" "$BUILD_FILE" || true
          grep -n "versionCode" "$BUILD_FILE" || true
          grep -n "versionName" "$BUILD_FILE" || true

          if ! grep -q "5.9.0" "$BUILD_FILE"; then
            echo "ERROR: Version 5.9.0 not found in app build file."
            exit 1
          fi

          echo ""
          echo "Version 5.9.0 verified."

      - name: Show Gradle information
        shell: bash
        run: |
          set -e

          PROJECT_DIR="${{ steps.project.outputs.project_dir }}"

          cd "$PROJECT_DIR"

          echo "========================================"
          echo "BUILD ENVIRONMENT"
          echo "========================================"

          echo "Project directory:"
          pwd

          echo ""
          echo "Java version:"
          java -version

          echo ""

          if [ -f "./gradlew" ]; then
            echo "Gradle wrapper found."
            chmod +x ./gradlew
            ./gradlew --version
          else
            echo "Gradle wrapper not found."
            echo "Using installed Gradle."
            gradle --version
          fi

      - name: Clean previous outputs
        shell: bash
        run: |
          set -e

          PROJECT_DIR="${{ steps.project.outputs.project_dir }}"

          rm -rf "$PROJECT_DIR/app/build"
          rm -rf "$PROJECT_DIR/build"
          rm -rf "$GITHUB_WORKSPACE/apk-output"

          mkdir -p "$GITHUB_WORKSPACE/apk-output"

          echo "Old build outputs removed."

      - name: Build 5M MULTI-SCALE APK
        shell: bash
        run: |
          set -e

          PROJECT_DIR="${{ steps.project.outputs.project_dir }}"

          cd "$PROJECT_DIR"

          echo "========================================"
          echo "BUILDING 5M MULTI-SCALE 5.9.0"
          echo "========================================"

          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
            ./gradlew clean assembleDebug --stacktrace --no-daemon
          else
            gradle clean assembleDebug --stacktrace --no-daemon
          fi

      - name: Locate generated APK
        shell: bash
        run: |
          set -e

          PROJECT_DIR="${{ steps.project.outputs.project_dir }}"

          APK_FILE=$(find "$PROJECT_DIR/app/build/outputs/apk" -type f -name "*.apk" | head -1)

          if [ -z "$APK_FILE" ]; then
            echo "ERROR: APK was not generated."
            echo ""
            echo "Searching project for APK files:"
            find "$PROJECT_DIR" -type f -name "*.apk" || true
            exit 1
          fi

          OUTPUT_APK="$GITHUB_WORKSPACE/apk-output/LiveSignalAssistant-5M-MULTISCALE-5.9.0.apk"

          cp "$APK_FILE" "$OUTPUT_APK"

          echo ""
          echo "========================================"
          echo "APK BUILD SUCCESSFUL"
          echo "========================================"
          echo ""

          ls -lh "$OUTPUT_APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: LiveSignalAssistant-5M-MULTISCALE-5.9.0
          path: apk-output/LiveSignalAssistant-5M-MULTISCALE-5.9.0.apk
          if-no-files-found: error
          retention-days: 30
