name: Build 90S Vision 2M3M APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Find and extract source ZIP
        shell: bash
        run: |
          set -euo pipefail

          ZIP=$(find "$GITHUB_WORKSPACE" -type f \
            -name "LiveSignalAssistant_71.7.27_90S_VISION_2M3M_EXPERIENCE.zip" \
            | head -n 1)

          if [ -z "$ZIP" ]; then
            echo "ERROR: Source ZIP not found."
            echo "Expected:"
            echo "LiveSignalAssistant_71.7.27_90S_VISION_2M3M_EXPERIENCE.zip"
            echo ""
            echo "ZIP files currently in repository:"
            find "$GITHUB_WORKSPACE" -type f -name "*.zip" -print || true
            exit 1
          fi

          echo "SOURCE ZIP:"
          echo "$ZIP"

          rm -rf "$RUNNER_TEMP/livesignal"
          mkdir -p "$RUNNER_TEMP/livesignal"

          unzip -q "$ZIP" -d "$RUNNER_TEMP/livesignal"

          SETTINGS=$(find "$RUNNER_TEMP/livesignal" -type f \
            \( -name "settings.gradle" -o -name "settings.gradle.kts" \) \
            | head -n 1)

          if [ -z "$SETTINGS" ]; then
            echo "ERROR: settings.gradle or settings.gradle.kts not found."
            echo "Extracted files:"
            find "$RUNNER_TEMP/livesignal" -maxdepth 4 -type f -print
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS")

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo "ANDROID PROJECT:"
          echo "$PROJECT_DIR"

      - name: Show project information
        shell: bash
        run: |
          set -euo pipefail

          echo "PROJECT_DIR=$PROJECT_DIR"

          echo "Gradle files:"
          find "$PROJECT_DIR" -maxdepth 4 -type f \
            \( -name "*.gradle" -o -name "*.gradle.kts" \) \
            -print

          echo "Manifest files:"
          find "$PROJECT_DIR" -type f \
            -name "AndroidManifest.xml" \
            -print

      - name: Accept Android SDK licenses
        shell: bash
        run: |
          set +e

          echo "ANDROID_HOME=${ANDROID_HOME:-}"
          echo "ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT:-}"

          SDKMANAGER=""

          if [ -n "${ANDROID_HOME:-}" ] && \
             [ -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" ]; then
            SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          fi

          if [ -z "$SDKMANAGER" ] && \
             [ -n "${ANDROID_SDK_ROOT:-}" ] && \
             [ -x "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" ]; then
            SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          fi

          if [ -z "$SDKMANAGER" ] && [ -n "${ANDROID_HOME:-}" ]; then
            SDKMANAGER=$(find "$ANDROID_HOME" \
              -type f \
              -name sdkmanager \
              2>/dev/null \
              | head -n 1)
          fi

          if [ -n "$SDKMANAGER" ]; then
            echo "Using sdkmanager:"
            echo "$SDKMANAGER"

            yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          else
            echo "sdkmanager not found."
            echo "Continuing to Gradle build."
          fi

          exit 0

      - name: Set up Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Build debug APK
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          echo "BUILD DIRECTORY:"
          pwd

          if [ -f "./gradlew" ]; then
            echo "Using project Gradle wrapper."
            chmod +x ./gradlew

            ./gradlew \
              --no-daemon \
              clean \
              assembleDebug \
              --stacktrace
          else
            echo "Gradle wrapper not found."
            echo "Using Gradle 8.10.2 from runner."

            gradle \
              --no-daemon \
              clean \
              assembleDebug \
              --stacktrace
          fi

      - name: Find and verify APK
        shell: bash
        run: |
          set -euo pipefail

          APK=$(find "$PROJECT_DIR" \
            -type f \
            -path "*/build/outputs/apk/debug/*.apk" \
            | head -n 1)

          if [ -z "$APK" ]; then
            echo "ERROR: Build completed but APK was not found."
            echo "Available APK files:"
            find "$PROJECT_DIR" -type f -name "*.apk" -print || true
            exit 1
          fi

          echo "APK FOUND:"
          echo "$APK"

          ls -lh "$APK"

          mkdir -p "$RUNNER_TEMP/final-apk"

          cp "$APK" \
            "$RUNNER_TEMP/final-apk/LiveSignalAssistant-90S-Vision-2M3M-debug.apk"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: LiveSignalAssistant-90S-Vision-2M3M
          path: ${{ runner.temp }}/final-apk/LiveSignalAssistant-90S-Vision-2M3M-debug.apk
          if-no-files-found: error
          retention-days: 7
